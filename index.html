}

/* ---------- Members ---------- */
function openMemberModal(id, prefill = {}) {
  const m = id ? findMember(id) : null;
  const s = state.settings;
  const plans = state.feePlans;
  const defaultPlan = !m ? plans.find(p => planTotal(p) === s.defaultFee) || (plans.length === 1 ? plans[0] : null) : null;
  const currentPlanId = m ? m.planId : defaultPlan ? defaultPlan.id : '';
  const startFee = m ? m.feeTarget : defaultPlan ? planTotal(defaultPlan) : (s.defaultFee || '');
  const plainDueHint = s.defaultDueDate ? `Leave blank to use the team date (${esc(fmtDate(s.defaultDueDate))}).` : 'Optional. Overdue status kicks in after this date.';
  openModal({
    title: m ? `Edit ${esc(m.name)}` : 'Add a team member',
    body: `
      <label class="field"><span>Name they go by</span><input type="text" name="name" value="${esc(m?.name || prefill.name || '')}" required autofocus maxlength="120"></label>
      <label class="field"><span>Other names (optional, one per line)</span><textarea name="aliases" rows="2" maxlength="400" placeholder="e.g. their legal name as it shows on e-Transfers">${esc((m?.aliases || prefill.aliases || []).join('\n'))}</textarea><small class="hint">Names that show up on bank e-Transfers or that they also go by. Payments under any of these names are matched to this person, whatever the order or capitals.</small></label>
      <div class="field-row">
        <label class="field"><span>Email</span><input type="email" name="email" value="${esc(m?.email || '')}" placeholder="optional"></label>
        <label class="field"><span>Phone</span><input type="tel" name="phone" value="${esc(m?.phone || '')}" placeholder="optional"></label>
      </div>
      ${plans.length
        ? `<label class="field"><span>Fee plan</span><select name="planId" id="memberPlan"><option value="">Custom amount (no plan)</option>${plans.map(p => `<option value="${p.id}" ${currentPlanId === p.id ? 'selected' : ''}>${esc(p.name)} · ${money(planTotal(p))}</option>`).join('')}</select><small class="hint" id="planHint"></small></label>`
        : '<p class="hint">Tip: set up fee plans (like “Full season $800 in 3 payments”) in <button type="button" class="link" data-tab="settings">Settings</button> to track installments automatically.</p>'}
      <div class="field-row">
        <label class="field"><span>Fee for the season</span><input type="number" name="feeTarget" min="0" step="0.01" inputmode="decimal" value="${startFee}" placeholder="0.00"><small class="hint">What this person owes. Adjust it for discounts, youth rates or part seasons.</small></label>
        <label class="field"><span>Due date</span><input type="date" name="dueDate" id="memberDue" value="${esc(m?.dueDate || '')}"><small class="hint" id="dueHint">${plainDueHint}</small></label>
      </div>
      <label class="field"><span>Notes</span><textarea name="notes" rows="2" placeholder="e.g. Youth rate, recruitment bonus, paying in installments…">${esc(m?.notes || prefill.notes || '')}</textarea></label>
      ${m ? `<p class="hint">Added ${esc(fmtTS(m.createdAt))} · last updated ${esc(fmtTS(m.updatedAt))}</p>` : ''}`,
    submitLabel: m ? 'Save changes' : 'Add member',
    onOpen: form => {
      const sel = form.querySelector('#memberPlan');
      if (!sel) return;
      const due = form.querySelector('#memberDue');
      const sync = fromChange => {
        const p = plans.find(x => x.id === sel.value);
        if (p && fromChange) form.elements.feeTarget.value = planTotal(p);
        due.disabled = !!p;
        form.querySelector('#dueHint').textContent = p ? 'Due dates come from the plan.' : plainDueHint;
        form.querySelector('#planHint').textContent = p ? `${p.installments.length > 1 ? `${p.installments.length} payments: ` : ''}${planSummary(p)}. If their fee is different, the last payment is adjusted.` : '';
      };
      sel.addEventListener('change', () => sync(true));
      sync(false);
    },
    onSubmit: (fd, form) => {
      const name = fd.name.trim().replace(/\s+/g, ' ');
      if (!name) return formError(form, 'Enter the member’s name.');
      const fee = fd.feeTarget.trim() ? parseMoney(fd.feeTarget) : 0;
      if (fee == null || fee < 0) return formError(form, 'The fee must be a number of zero or more.');
      const clash = state.members.find(x => x.id !== m?.id && normName(x.name) === normName(name));
      if (clash && form.dataset.dupOk !== name) {
        form.dataset.dupOk = name;
        return formError(form, `There’s already a member called ${clash.name}. Click the button again to save anyway.`);
      }
      const planId = plans.some(p => p.id === fd.planId) ? fd.planId : '';
      const now = nowISO();
      const aliases = parseAliases(fd.aliases, name);
      const shared = aliases.map(a => ({ a, other: state.members.find(x => x.id !== m?.id && memberNames(x).some(n => samePerson(n, a))) })).find(x => x.other);
      if (shared && form.dataset.aliasOk !== shared.a) {
        form.dataset.aliasOk = shared.a;
        return formError(form, `“${shared.a}” is already a name for ${shared.other.name}, so payments under it couldn’t be matched automatically. Click the button again to save anyway.`);
      }
      const fields = {
        name, aliases, email: fd.email.trim(), phone: fd.phone.trim(), feeTarget: fee, planId,
        dueDate: isValidDateStr(fd.dueDate) ? fd.dueDate : (planId ? m?.dueDate || '' : ''),
        notes: fd.notes.trim(),
      };
      if (m) {
        const changes = [];
        if (m.feeTarget !== fee) changes.push(`fee ${money(m.feeTarget)} → ${money(fee)}`);
        if (m.planId !== planId) changes.push(planId ? `plan → ${plans.find(p => p.id === planId).name}` : 'removed from plan');
        Object.assign(m, fields, { updatedAt: now });
        commit(`Updated ${name}’s details${changes.length ? ` (${changes.join(', ')})` : ''}`, { type: 'member' });
        toast('Member updated');
      } else {
        state.members.push({ id: uid(), ...fields, payments: [], createdAt: now, updatedAt: now });
        commit(`Added member ${name}`, { type: 'member' });
        toast(`${name} added`);
      }
    },
  });
}

function deleteMember(id) {
  const m = findMember(id);
  if (!m) return;
  const n = m.payments.length, paid = memberPaid(m);
  confirmDialog({
    title: `Remove ${esc(m.name)}?`,
    message: n
      ? `Their ${plural(n, 'payment')} (${money(paid)}) will be removed too, which lowers fees collected and your net balance.`
      : 'They have no payments recorded.',
    confirmLabel: 'Remove member',
    danger: true,
    onConfirm: () => {
      const snap = JSON.stringify(state);
      state.members = state.members.filter(x => x.id !== id);
      ui.expanded.delete(id);
      commit(`Removed member ${m.name}${n ? ` and ${plural(n, 'payment')} (${money(paid)})` : ''}`, { type: 'delete' });

function toggleMember(id) {
  if (ui.expanded.has(id)) ui.expanded.delete(id); else ui.expanded.add(id);
  refreshMembersTable();

/* ---------- Payments ---------- */
function openPaymentModal(memberId, paymentId) {
  if (!state.members.length) {
    toast('Add a team member first');
    if (ui.tab !== 'members') goTab('members');
    openMemberModal();
    return;
  }
  const member = memberId ? findMember(memberId) : null;
  const payment = paymentId && member ? member.payments.find(p => p.id === paymentId) : null;
  const editing = !!payment;
  const members = [...state.members].sort(byName);
  const selected = member || members.find(m => memberBalance(m) > 0) || members[0];
  const method = payment?.method || ui.lastMethod;
  const balOf = m => memberBalance(m) + (editing && m === member ? payment.amount : 0);
  const startAmount = editing ? payment.amount : suggestedPayment(selected);

  openModal({
    title: editing ? 'Edit payment' : 'Record a payment',
    body: `
      ${editing
        ? `<input type="hidden" name="memberId" value="${member.id}"><div class="field"><span>Member</span><div class="static">${esc(member.name)}</div></div>`
        : `<label class="field"><span>Member</span><select name="memberId" id="payMember" required>${members.map(m => {
            const b = memberBalance(m);
            return `<option value="${m.id}" ${m.id === selected.id ? 'selected' : ''}>${esc(m.name)} ${b > 0 ? `· owes ${money(b)}` : '· paid up'}</option>`;
          }).join('')}</select></label>`}
      <div class="field-row">
        <label class="field"><span>Amount</span><input type="number" name="amount" id="payAmount" step="0.01" min="0.01" inputmode="decimal" required value="${startAmount}" ${editing || member ? 'autofocus' : ''}></label>
        <label class="field"><span>Date received</span><input type="date" name="date" required value="${payment?.date || todayStr()}"></label>
      </div>
      <fieldset class="field"><legend>Payment method</legend><div class="pills">${METHODS.map(x =>
        `<label class="pill"><input type="radio" name="method" value="${esc(x)}" ${x === method ? 'checked' : ''}><span>${esc(x)}</span></label>`).join('')}</div></fieldset>
      <label class="field"><span>Notes (optional)</span><input type="text" name="note" value="${esc(payment?.note || '')}" placeholder="e.g. 2nd installment, paid at Pickering, e-Transfer ref #"></label>
      <p class="hint" id="payHint"></p>
      ${editing ? `<p class="hint">Recorded ${esc(fmtTS(payment.createdAt))}${payment.updatedAt !== payment.createdAt ? ` · last edited ${esc(fmtTS(payment.updatedAt))}` : ''}</p>` : ''}`,
    submitLabel: editing ? 'Save changes' : 'Record payment',
    onOpen: form => {
      const amt = form.querySelector('#payAmount');
      const sel = form.querySelector('#payMember');
      let touched = editing;
      const hint = () => {
        const m = findMember(form.elements.memberId.value);
        const h = form.querySelector('#payHint');
        if (!m) return;
        const b = balOf(m), a = parseMoney(amt.value) || 0, next = editing ? null : nextInstallment(m);
        let text, warn = false;
        if (b <= 0) text = `${m.name} has nothing left to pay, so this will show as a credit.`;
        else if (a > b) { text = `That’s ${money(a - b)} more than the ${money(b)} owing. The extra will show as a credit.`; warn = true; }
        else if (a > 0 && a === b) text = `Balance owing: ${money(b)} → paid in full`;
        else if (a > 0) text = `Balance owing: ${money(b)} → ${money(b - a)} after this payment`;
        else text = `Balance owing: ${money(b)}`;
        if (next && b > 0) text += `. Next installment: ${money(next.remaining)}${next.dueDate ? ` due ${fmtDate(next.dueDate)}` : ''} (payment ${next.number} of ${next.of}).`;
        h.textContent = text;
        h.className = warn ? 'hint warn' : 'hint';
      };
      amt.addEventListener('input', () => { touched = true; hint(); });
      if (sel) sel.addEventListener('change', () => {
        const m = findMember(sel.value);
        if (!touched && m) amt.value = suggestedPayment(m);
        hint();
      });
      hint();
    },
    onSubmit: (fd, form) => {
      const amount = parseMoney(fd.amount);
      if (!amount || amount <= 0) return formError(form, 'Enter an amount greater than zero.');
      if (!isValidDateStr(fd.date)) return formError(form, 'Choose the date the payment was received.');
      const m = findMember(fd.memberId);
      if (!m) return formError(form, 'That member no longer exists.');
      const now = nowISO();
      const methodVal = METHODS.includes(fd.method) ? fd.method : 'Other';
      ui.lastMethod = methodVal;
      if (editing) {
        Object.assign(payment, { amount, date: fd.date, method: methodVal, note: fd.note.trim(), updatedAt: now });
        m.updatedAt = now;
        commit(`Edited a payment from ${m.name} (now ${money(amount)}, ${methodVal})`, { type: 'edit' });
        toast('Payment updated');
      } else {
        m.payments.push({ id: uid(), amount, date: fd.date, method: methodVal, note: fd.note.trim(), createdAt: now, updatedAt: now });
        m.updatedAt = now;
        commit(`Payment from ${m.name} · ${methodVal}`, { type: 'payment', amount, dir: 'in' });
        toast(`Recorded ${money(amount)} from ${m.name}`);
      }
    },
  });
}

function deletePayment(memberId, paymentId) {
  const m = findMember(memberId);
  const p = m?.payments.find(x => x.id === paymentId);
  if (!p) return;
  confirmDialog({
    title: 'Delete this payment?',
    message: `${money(p.amount)} from ${m.name} on ${fmtDate(p.date)} (${p.method}) will be removed from fees collected.`,
    confirmLabel: 'Delete payment',
    danger: true,
    onConfirm: () => {
      const snap = JSON.stringify(state);
      m.payments = m.payments.filter(x => x.id !== paymentId);
      m.updatedAt = nowISO();
      commit(`Deleted a ${money(p.amount)} payment from ${m.name}`, { type: 'delete' });
      undoable('Payment deleted', snap, `delete payment from ${m.name}`);
    },
  });
}

      <div class="field-row">

        <label class="field"><span>Unit price</span><input type="number" name="unitPrice" id="expUnit" min="0" step="any" inputmode="decimal" required value="${e ? e.unitPrice : ''}" placeholder="0.00"></label>
        <div class="field"><span>Total (calculated)</span><output class="total-out" id="expTotal">${money(e ? e.total : 0)}</output></div>
      </div>
      <div class="field-row">
        <label class="field"><span>Paid by</span><input type="text" name="paidBy" list="peopleList" value="${esc(e?.paidBy || '')}" placeholder="Team account, or who paid"><datalist id="peopleList">${people.map(p => `<option value="${esc(p)}">`).join('')}</datalist></label>
        <label class="field"><span>Reimbursement</span><select name="reimbursement" id="expReimbSel">${Object.entries(REIMB).map(([k, l]) => `<option value="${k}" ${(e?.reimbursement || 'none') === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      </div>
      <p class="hint" id="reimbHint"></p>
      <div class="field"><span>Receipt photos</span>
        <div class="photo-grid" id="photoGrid"></div>
        <input type="file" id="photoInput" accept="image/*,application/pdf" multiple hidden>
        <small class="hint" id="photoHint">Add photos or PDFs of the receipt. Photos are resized to save space and kept in this browser. You can also drag them in, or paste a screenshot with Ctrl+V.</small>
      </div>
      <div class="field-row">
        <label class="field"><span>Receipt # / reference (optional)</span><input type="text" name="receipt" value="${esc(e?.receipt || '')}" placeholder="Invoice or confirmation number"></label>
      </div>
      <label class="field"><span>Notes</span><textarea name="notes" rows="2" placeholder="Anything worth remembering">${esc(e?.notes || '')}</textarea></label>
      ${e ? `<p class="hint">Added ${esc(fmtTS(e.createdAt))}${e.updatedAt !== e.createdAt ? ` · last edited ${esc(fmtTS(e.updatedAt))}` : ''}${e.reimbursedAt ? ` · reimbursed ${esc(fmtTS(e.reimbursedAt))}` : ''}</p>` : ''}`,
    submitLabel: e ? 'Save changes' : 'Add expense',
    onOpen: form => {
      const qty = form.querySelector('#expQty'), unit = form.querySelector('#expUnit'), out = form.querySelector('#expTotal');
      const calc = () => { out.textContent = money((Number(qty.value) || 0) * (Number(unit.value) || 0)); };
      qty.addEventListener('input', calc);
      unit.addEventListener('input', calc);

      const rs = form.querySelector('#expReimbSel'), paidBy = form.elements.paidBy, h = form.querySelector('#reimbHint');
      const reimbHint = () => {
        if (rs.value === 'pending' && !paidBy.value.trim()) { h.textContent = 'Add who paid, so you know who to pay back.'; h.className = 'hint warn'; }
        else if (rs.value === 'none' && paidBy.value.trim() && !/team/i.test(paidBy.value)) { h.textContent = `If ${paidBy.value.trim()} paid out of their own pocket, set Reimbursement to “Pending”.`; h.className = 'hint'; }
        else h.textContent = '';
      };
      rs.addEventListener('change', reimbHint);
      paidBy.addEventListener('input', reimbHint);
      reimbHint();

      const grid = form.querySelector('#photoGrid'), input = form.querySelector('#photoInput'), photoHint = form.querySelector('#photoHint');
      const draw = () => {
        grid.innerHTML = photos.map((p, i) => `<div class="photo-tile" title="${esc(p.name)}">${p.type === 'application/pdf' ? '<span class="pdf-label">PDF</span>' : `<img data-thumb="${esc(p.id)}" alt="${esc(p.name)}">`}<button type="button" class="photo-remove" data-remove="${i}" aria-label="Remove ${esc(p.name)}">${icon('x')}</button></div>`).join('')
          + `<button type="button" class="photo-add" id="photoAdd">${icon('camera')}<span>Add photo</span></button>`;
        hydrateThumbs(grid);
      };
      const addFiles = async files => {
        if (!files.length) return;
        photoHint.textContent = `Processing ${plural(files.length, 'file')}…`;
        for (const f of files) {
          try {
            const rec = await processReceiptFile(f);
            added.set(rec.id, rec);
            thumbCache.set(rec.id, rec.thumb);
            photos.push({ id: rec.id, name: rec.name, type: rec.type, size: rec.size, addedAt: rec.addedAt });
          } catch (err) { formError(form, err.message); }
        }
        photoHint.textContent = `${plural(photos.length, 'receipt file')} attached. They’re saved when you click ${e ? 'Save changes' : 'Add expense'}.`;
        draw();
      };
      grid.addEventListener('click', ev => {
        const r = ev.target.closest('[data-remove]');
        if (r) { photos.splice(Number(r.dataset.remove), 1); draw(); }
        else if (ev.target.closest('#photoAdd')) input.click();
      });
      input.addEventListener('change', () => { addFiles([...input.files]); input.value = ''; });

/* =====================================================================
   Spreadsheet import: CSV/pasted cells, or .xlsx read directly
   ===================================================================== */
function parseDelimited(text) {
  text = String(text).replace(/^﻿/, '');
  const firstLine = text.split(/\r?\n/).find(l => l.trim()) || '';
  const count = ch => firstLine.split(ch).length - 1;
  const delim = count('\t') > 0 && count('\t') >= count(',') ? '\t' : count(';') > count(',') ? ';' : ',';
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false;
      } else field += ch;
    } else if (ch === '"' && field.trim() === '') { field = ''; inQuotes = true; }
    else if (ch === delim) { row.push(field); field = ''; }
    else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (ch !== '\r') field += ch;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows; // blank rows are kept so row numbers match the spreadsheet
}

/* .xlsx files are zip archives of XML; modern browsers can unzip them natively. */
async function unzipEntries(buf) {
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 66000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('it doesn’t look like an Excel (.xlsx) file');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const entries = new Map();
  const dec = new TextDecoder();
  for (let n = 0; n < count && dv.getUint32(p, true) === 0x02014b50; n++) {
    const nameLen = dv.getUint16(p + 28, true), extraLen = dv.getUint16(p + 30, true), commentLen = dv.getUint16(p + 32, true);
    entries.set(dec.decode(buf.subarray(p + 46, p + 46 + nameLen)), { method: dv.getUint16(p + 10, true), size: dv.getUint32(p + 20, true), local: dv.getUint32(p + 42, true) });
    p += 46 + nameLen + extraLen + commentLen;
  }
  return {
    async text(name) {
      const e = entries.get(name);
      if (!e) return null;
      const start = e.local + 30 + dv.getUint16(e.local + 26, true) + dv.getUint16(e.local + 28, true);
      const raw = buf.subarray(start, start + e.size);
      let bytes = raw;
      if (e.method === 8) {
        if (typeof DecompressionStream === 'undefined') throw new Error('this browser can’t open .xlsx files, so save the tab as CSV instead');
        const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        bytes = new Uint8Array(await new Response(stream).arrayBuffer());
      } else if (e.method !== 0) throw new Error('the file uses an unsupported compression');
      return new TextDecoder().decode(bytes);
    },
  };
}
const xmlDoc = s => new DOMParser().parseFromString(s, 'application/xml');
const colIndex = ref => { let n = 0; for (const ch of ref.replace(/\d+$/, '')) n = n * 26 + (ch.charCodeAt(0) - 64); return n - 1; };
function isDateFormat(code) {
  const c = String(code).replace(/"[^"]*"|\[[^\]]*\]|\\./g, '').toLowerCase();
  return /[dy]/.test(c) || (/m/.test(c) && !/[hs]/.test(c));
}
async function readXlsx(file) {
  const zip = await unzipEntries(new Uint8Array(await file.arrayBuffer()));
  const wbText = await zip.text('xl/workbook.xml');
  if (!wbText) throw new Error('no worksheets were found');
  const wb = xmlDoc(wbText);
  const relMap = {};
  const relText = await zip.text('xl/_rels/workbook.xml.rels');
  if (relText) for (const r of xmlDoc(relText).getElementsByTagName('Relationship')) relMap[r.getAttribute('Id')] = r.getAttribute('Target');
  const shared = [];
  const ssText = await zip.text('xl/sharedStrings.xml');
  if (ssText) for (const si of xmlDoc(ssText).getElementsByTagName('si')) shared.push([...si.getElementsByTagName('t')].filter(t => t.parentNode.nodeName !== 'rPh').map(t => t.textContent).join(''));
  const dateStyles = new Set();
  const stText = await zip.text('xl/styles.xml');
  if (stText) {
    const st = xmlDoc(stText);
    const custom = {};
    for (const f of st.getElementsByTagName('numFmt')) custom[f.getAttribute('numFmtId')] = f.getAttribute('formatCode');
    const xfs = st.getElementsByTagName('cellXfs')[0];
    if (xfs) [...xfs.getElementsByTagName('xf')].forEach((xf, i) => {
      const id = Number(xf.getAttribute('numFmtId') || 0);
      if ((id >= 14 && id <= 22) || (id >= 45 && id <= 47) || (custom[id] && isDateFormat(custom[id]))) dateStyles.add(i);
    });
  }
  const sheets = [];
  for (const s of wb.getElementsByTagName('sheet')) {
    const target = relMap[s.getAttribute('r:id')] || '';
    const path = target.startsWith('/') ? target.slice(1) : 'xl/' + target.replace(/^\.\//, '');
    const text = await zip.text(path);
    if (!text) continue;
    sheets.push({ name: (s.getAttribute('name') || 'Sheet').trim(), hidden: (s.getAttribute('state') || 'visible') !== 'visible', rows: sheetRows(xmlDoc(text), shared, dateStyles) });
  }
  return sheets;
}
function sheetRows(doc, shared, dateStyles) {
  const rows = [];
  for (const row of doc.getElementsByTagName('row')) {
    const r = Number(row.getAttribute('r')) - 1;
    const at = Number.isInteger(r) && r >= 0 ? r : rows.length;
    const cells = [];
    let next = 0;
    for (const c of row.getElementsByTagName('c')) {
      const ref = c.getAttribute('r');
      const ci = ref ? colIndex(ref) : next;
      next = ci + 1;
      const t = c.getAttribute('t');
      const v = c.getElementsByTagName('v')[0]?.textContent;
      let val = '';
      if (t === 's') val = shared[Number(v)] ?? '';
      else if (t === 'inlineStr') val = [...c.getElementsByTagName('t')].map(x => x.textContent).join('');
      else if (t === 'str') val = v ?? '';
      else if (t === 'b') val = v === '1' ? 'TRUE' : 'FALSE';
      else if (t !== 'e' && v != null && v !== '') {
        const num = Number(v);
        if (dateStyles.has(Number(c.getAttribute('s'))) && num > 0 && num < 2958466) {
          const d = new Date(Date.UTC(1899, 11, 30) + Math.round(num * 86400000));
          val = `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
        } else val = String(Number(num.toPrecision(12)));
      }
      cells[ci] = val;
    }
    rows[at] = Array.from(cells, x => x ?? '');
  }
  return Array.from(rows, x => x || []);
}

    const get = rowGetter(r), rowNum = i + imp.firstDataRow + 1, errors = [], notes = [];
    let skip = false;
    const name = (get('name') || [get('firstName'), get('lastName')].filter(Boolean).join(' ')).replace(/\s+/g, ' ').trim();
    if (!name) {
      if (values.every(v => !v || parseMoney(v) === 0)) return; // leftover formula cells with no person
      errors.push('No name');
    } else if (/\btotals?\b/i.test(name)) errors.push('Looks like a totals row');
    else if (looksLikeDate(name) || /^-?\d+([.,]\d+)?$/.test(name)) errors.push('Name looks like a date or number');

    let plan = null;
    const planS = get('feePlan');
    if (planS) {
      plan = state.feePlans.find(p => normName(p.name) === normName(planS))
        || state.feePlans.find(p => normKey(p.name).startsWith(normKey(planS)) || normKey(planS).startsWith(normKey(p.name))) || null;
      if (!plan) notes.push(`No fee plan called “${planS}”`);
    }
    let fee = null;
    const feeS = get('feeTarget');
    if (feeS) {
      fee = parseMoney(feeS);
      if (fee == null) errors.push(`Fee “${feeS}” isn’t a number`);
      else if (fee < 0) errors.push('Negative fee');
    }
    const hasFee = fee != null && fee > 0;
    if (fee == null) fee = plan ? planTotal(plan) : def;
    if (!plan && imp.matchPlans && hasFee) {
      const matches = state.feePlans.filter(p => planTotal(p) === fee);
      if (matches.length === 1) plan = matches[0];
    }
    if (plan) notes.push(`Plan: ${plan.name}`);

    const payments = [];
    for (const k of payKeys) {
      const s = get(k);
      if (!s) continue;
      if (k === 'paid' && /^(y|yes|true|paid|paid in full|full|done|x|✓|✔)$/i.test(s)) { if (fee > 0) payments.push(fee); continue; }
      if (/^(n|no|false|unpaid|none|-|—)$/i.test(s)) continue;
      const a = parseMoney(s);
      if (a == null) errors.push(`${IMPORT_FIELDS.members.find(f => f.key === k).label} “${s}” isn’t a number`);
      else if (a < 0) errors.push('Negative payment');
      else if (a > 0) payments.push(a);
    }
    if (!payKeys.length && map.balance >= 0) {
      const balS = get('balance');
      if (balS) {
        const bal = parseMoney(balS);
        if (bal == null) errors.push(`Balance “${balS}” isn’t a number`);
        else if (fee - bal > 0) { payments.push(round2(fee - bal)); notes.push('Paid worked out from balance'); }
      }
    }
    const paid = sumBy(payments, x => x);

    const pdS = get('paymentDate');
    let paymentDate = parseDateFlexible(pdS, imp.dayFirst);
    if (pdS && !paymentDate && paid > 0) notes.push(`Couldn’t read date “${pdS}”`);
    const undated = paid > 0 && !paymentDate;
    paymentDate = paymentDate || imp.undatedDate;
    const ddS = get('dueDate');
    const dueDate = parseDateFlexible(ddS, imp.dayFirst) || '';
    if (ddS && !dueDate) notes.push(`Couldn’t read due date “${ddS}”`);
    if (!errors.length && !hasFee && !paid && !plan) { notes.push('No fee or payments yet, so not ticked'); skip = true; }

    const rec = { name, aliases: parseAliases(get('aliases'), name), email: get('email'), phone: get('phone'), feeTarget: fee, planId: plan ? plan.id : '', payments, paid, method: normalizeMethod(get('method')), paymentDate, undated, dueDate, notes: get('notes') };
    let dup = false;
    if (name && !errors.length) {
      const key = tokenKey(name);
      if (seen.has(key)) notes.push(`Same person as row ${seen.get(key)}, so payments are combined`);
      else seen.set(key, rowNum);
      const existing = imp.mode === 'append' ? matchMember(name) : null;
      dup = !!existing;
      if (existing && !samePerson(existing.name, name)) notes.push(`Matches ${existing.name} (other name)`);
      if (dup && imp.dupMode === 'skip') skip = true;
    }
    const defaultInclude = !skip;
    results.push({ rowNum, rec, errors, notes, dup, defaultInclude, include: !errors.length && (imp.overrides[rowNum] ?? defaultInclude) });
  });
  return results;
}

function buildExpenseRows() {
  const imp = ui.imp;
  const existing = new Set(imp.mode === 'append' ? state.expenses.map(expenseKey) : []);
  const results = [];
  const newCats = new Set();
  let section = '';
  imp.rows.forEach((r, i) => {
    if (repeatedHeader(r)) { section = String(r[imp.mapping.description] ?? '').trim(); return; }
    const values = mappedValues(r);
    if (!values.some(Boolean)) return;
    const get = rowGetter(r), rowNum = i + imp.firstDataRow + 1, errors = [], notes = [];
    let skip = false;
    const dS = get('date');
    let date = parseDateFlexible(dS, imp.dayFirst);
    if (dS && !date) notes.push(`Couldn’t read date “${dS}”`);
    const undated = !date;
    date = date || imp.undatedDate;

    const vendor = get('vendor');
    let description = get('description'), notesTxt = get('notes');
    if (!description) description = vendor;
    else if (vendor) notesTxt = `Vendor: ${vendor}${notesTxt ? ' · ' + notesTxt : ''}`;

    const qS = get('quantity'), uS = get('unitPrice'), tS = get('total');
    let qty = qS ? parseMoney(qS) : null;
    if (qS && (qty == null || qty <= 0)) errors.push(`Quantity “${qS}” isn’t valid`);
    let unit = uS ? parseMoney(uS) : null;
    if (uS && unit == null) errors.push(`Unit price “${uS}” isn’t a number`);
    let total = tS ? parseMoney(tS) : null;
    if (tS && total == null) errors.push(`Total “${tS}” isn’t a number`);
    if (!errors.length) {
      if (unit == null && total == null) errors.push('No amount');
      else {
        qty = qty || 1;
        if (unit == null) unit = Math.round((total / qty) * 10000) / 10000;
        else if (total != null && Math.abs(round2(qty * unit) - total) > 0.01) {
          notes.push(`Total ${money(total)} didn’t match qty × price, so the total was kept`);
          unit = Math.round((total / qty) * 10000) / 10000;
        }
        total = round2(qty * unit);
        if (total < 0) errors.push('Negative amount');
      }
    }
    if (/\btotals?\b/i.test(description)) errors.push('Looks like a totals row');
    else if (looksLikeDate(description)) { notes.push('Looks like a date, not an item, so not ticked'); skip = true; }
    else if (/\b(float|in the bank|bank balance|opening balance|carried over|balance forward)\b/i.test(description)) { notes.push('Looks like a bank balance, not an expense, so not ticked'); skip = true; }
    if (!description) { description = 'Imported expense'; notes.push('No description'); }

    const info = resolveCategory(get('category') || section, description);
    let category;
    if (info.cat) { category = info.cat; if (info.note) notes.push(info.note); }
    else {
      newCats.add(info.newName);
      if (imp.createCats) { category = info.newName; notes.push(`New category: ${info.newName}`); }
      else { category = fallbackCategory(); notes.push(`${info.raw ? `“${info.raw}”` : 'Category'} → ${category}`); }
    }
    const rS = get('reimbursement'), rb = normalizeReimb(rS);
    if (rS && !rb.matched) notes.push(`Reimbursement “${rS}” not recognised, set to team funds`);
    // a bare "No" with nobody (or the team) as payer means nothing is owed back, not "pending"
    if (rb.val === 'pending' && /^(no|n|false)$/i.test(rS) && (!get('paidBy') || /team/i.test(get('paidBy')))) rb.val = 'none';

    const rec = {
      date, undated, description, category, quantity: qty ?? 1, unitPrice: unit ?? 0, total: total ?? 0,
      paymentMethod: normalizeMethod(get('method')), paidBy: get('paidBy'), reimbursement: rb.val, receipt: get('receipt'), notes: notesTxt,
    };
    const dup = !errors.length && existing.has(expenseKey(rec));
    if (dup && imp.dupMode === 'skip') skip = true;
    const defaultInclude = !skip;
    results.push({ rowNum, rec, errors, notes, dup, defaultInclude, include: !errors.length && (imp.overrides[rowNum] ?? defaultInclude) });
  });
  results.newCats = [...newCats];
  return results;
}

function buildDropInRows() {
  const imp = ui.imp, results = [];
  const dupKey = d => `${tokenKey(d.name)}|${d.date}|${normKey(d.session)}`;
  const existing = new Set(imp.mode === 'append' ? state.dropIns.map(dupKey) : []);
  imp.rows.forEach((r, i) => {
    const values = mappedValues(r);
    if (!values.some(Boolean) || repeatedHeader(r)) return;
    const get = rowGetter(r), rowNum = i + imp.firstDataRow + 1, errors = [], notes = [];
    let skip = false;
    const name = tidyName(get('name'));
    if (!name) {
      if (values.every(v => !v || parseMoney(v) === 0)) return;
      errors.push('No name');
    } else if (/\btotals?\b/i.test(name)) errors.push('Looks like a totals row');
    else if (looksLikeDate(name) || /^-?[$\d.,\s]+$/.test(name)) errors.push('Name looks like a date or amount');
    const dS = get('date');
    let date = parseDateFlexible(dS, imp.dayFirst);
    if (dS && !date) notes.push(`Couldn’t read date “${dS}”`);
    const undated = !date;
    date = date || imp.undatedDate;
    const session = get('session').replace(/\s*\n\s*/g, '; ');
    const feeS = get('fee'), paidS = get('paid');
    let fee = feeS ? parseMoney(feeS) : null, paid = paidS ? parseMoney(paidS) : null;
    if (feeS && fee == null) errors.push(`Charge “${feeS}” isn’t a number`);
    if (paidS && paid == null) {
      if (/^(y|yes|paid|x|✓|✔)$/i.test(paidS)) paid = fee ?? state.settings.dropInFee;
      else if (/^(n|no|unpaid)$/i.test(paidS)) paid = 0;
      else errors.push(`Paid “${paidS}” isn’t a number`);
    }
    if (fee == null && paid != null) fee = paid;
    if (fee == null) { fee = 0; if (!errors.length) notes.push('No charge recorded'); }
    paid = paid ?? 0;
    if (!errors.length && !fee && !paid && !session) { notes.push('Nothing recorded for them, so not ticked'); skip = true; }
    const member = name ? matchMember(name) : null;
    if (member) notes.push(`Also a member (${member.name})`);
    let method = normalizeMethod(get('method'));
    if (method === 'Other') method = imp.defaultMethod;
    const rec = { name, date, undated, session, fee, paid, method, notes: get('notes') };
    const dup = !errors.length && existing.has(dupKey(rec));
    if (dup) { notes.push('Already recorded'); if (imp.dupMode === 'skip') skip = true; }
    results.push({ rowNum, rec, errors, notes, dup, defaultInclude: !skip, include: !errors.length && (imp.overrides[rowNum] ?? !skip) });
  });
  return results;
}

/** Payments such as a bank e-Transfer list: each one is matched to a member (by any of their names) or a drop-in. */
function buildPaymentRows() {
  const imp = ui.imp, results = [];
  imp.rows.forEach((r, i) => {
    const values = mappedValues(r);
    if (!values.some(Boolean) || repeatedHeader(r)) return;
    const get = rowGetter(r), rowNum = i + imp.firstDataRow + 1, errors = [], notes = [];
    const name = get('name').replace(/\s+/g, ' ').trim();
    const aS = get('amount'), amount = parseMoney(aS);
    if (!name) errors.push('No name');
    else if (/\btotals?\b/i.test(name)) errors.push('Looks like a totals row');
    else if (looksLikeDate(name) || /^-?[$\d.,\s]+$/.test(name)) errors.push('Name looks like a date or amount');
    if (!aS) errors.push('No amount');
    else if (amount == null) errors.push(`Amount “${aS}” isn’t a number`);
    else if (amount <= 0) errors.push('Money going out (add it as an expense instead)');
    const dS = get('date');
    let date = parseDateFlexible(dS, imp.dayFirst);
    if (dS && !date) notes.push(`Couldn’t read date “${dS}”`);
    const undated = !date;
    date = date || imp.undatedDate;
    let method = normalizeMethod(get('method'));
    if (method === 'Other') method = imp.defaultMethod;

    const member = !errors.length ? matchMember(name) : null;
    const visits = !errors.length ? state.dropIns.filter(d => samePerson(d.name, name)) : [];
    const dropOwing = visits.some(d => dropOwed(d) > 0);
    // someone who is both a member and a past drop-in: an unpaid drop-in is the likelier reason for a small payment
    let auto = member && !(dropOwing && memberBalance(member) <= 0) ? member.id : visits.length ? 'dropin' : 'skip';
    let dup = false;
    if (member && member.payments.some(p => p.date === date && Math.abs(p.amount - amount) < 0.005)) dup = true;
    // same amount on the same day (or on a visit imported without a date); regulars paying the same rate each week aren't duplicates
    if (visits.length && !dropOwing && visits.some(d => Math.abs(d.paid - amount) < 0.005 && (d.date === date || d.dateUnknown))) dup = true;
    if (dup) { notes.push('Looks already recorded, so not imported'); auto = 'skip'; }
    else if (member && !samePerson(member.name, name)) notes.push(`Matched to ${member.name} by their other name`);
    else if (!member && visits.length) notes.push(visits.some(d => dropOwed(d) > 0) ? 'Pays their unpaid drop-in' : 'Drop-in (seen before)');
    const target = errors.length ? 'skip' : (imp.matches[rowNum] ?? auto);
    if (!member && !visits.length && !errors.length && target === 'skip') notes.push(state.members.some(m => memberNames(m).some(n => samePerson(n, name))) ? 'More than one member has this name; choose who' : 'No member or drop-in with this name; choose who it’s from');
    if (!errors.length && target !== 'skip' && target !== 'dropin' && target !== auto) {
      const m = findMember(target);
      if (m && imp.learnAliases && !memberNames(m).some(n => samePerson(n, name))) notes.push(`Will remember “${tidyName(name)}” as another name for ${m.name}`);
    }
    results.push({ rowNum, rec: { name, date, undated, amount: amount ?? 0, method, notes: get('notes') }, errors, notes, dup, target, defaultInclude: auto !== 'skip', include: !errors.length && target !== 'skip' });
  });
  return results;
}

const ROW_BUILDERS = { members: buildMemberRows, expenses: buildExpenseRows, dropins: buildDropInRows, payments: buildPaymentRows };
const buildImportRows = () => ROW_BUILDERS[ui.imp.resolvedType]();

function doImport() {
  const imp = ui.imp, type = imp.resolvedType;
  const all = buildImportRows();
  const results = all.filter(r => r.include);
  if (!results.length) { toast('No rows are ticked to import'); return; }
  const existingCount = { members: state.members.length, expenses: state.expenses.length, dropins: state.dropIns.length, payments: 0 }[type];
  const source = imp.source || 'pasted data';

  const run = () => {
    const snap = JSON.stringify(state);
    const now = nowISO();
    let summary;
    if (type === 'members') {
      if (imp.mode === 'replace') { state.members = []; ui.expanded.clear(); }
      const before = [...state.members];
      const touched = new Map();
      let added = 0, updated = 0, payments = 0;
      for (const { rec, dup } of results) {
        const key = tokenKey(rec.name);
        let m = touched.get(key);
        if (!m && dup && imp.dupMode === 'merge') {
          m = before.find(x => memberNames(x).some(n => samePerson(n, rec.name)));
          if (m) { touched.set(key, m); updated++; }
        }
        if (!m) {
          m = { id: uid(), name: rec.name, aliases: rec.aliases, email: rec.email, phone: rec.phone, feeTarget: rec.feeTarget, planId: rec.planId, dueDate: rec.dueDate, notes: rec.notes, payments: [], createdAt: now, updatedAt: now };
          state.members.push(m);
          touched.set(key, m);
          added++;
        } else {
          if (!m.email && rec.email) m.email = rec.email;
          if (!m.phone && rec.phone) m.phone = rec.phone;
          if (!m.dueDate && rec.dueDate) m.dueDate = rec.dueDate;
          if (!m.planId && rec.planId) m.planId = rec.planId;
          for (const a of [rec.name, ...rec.aliases]) if (!memberNames(m).some(n => samePerson(n, a))) m.aliases.push(a);
          if (rec.notes && !m.notes.includes(rec.notes)) m.notes = m.notes ? `${m.notes}\n${rec.notes}` : rec.notes;
          m.updatedAt = now;
        }
        rec.payments.forEach((amount, k) => {
          m.payments.push({ id: uid(), amount, method: rec.method, date: rec.paymentDate, note: `Imported from ${source}${rec.payments.length > 1 ? ` (payment ${k + 1})` : ''}`, createdAt: now, updatedAt: now });
          payments++;
        });
      }
      summary = `Imported ${plural(added, 'member')}${updated ? `, updated ${updated} existing` : ''} and ${plural(payments, 'payment')} from ${source}${imp.mode === 'replace' ? ' (replaced previous members)' : ''}`;
    } else if (type === 'expenses') {
      if (imp.mode === 'replace') state.expenses = [];
      for (const { rec } of results) {
        if (!state.categories.includes(rec.category)) {
          const at = state.categories.indexOf('Miscellaneous');
          if (at >= 0) state.categories.splice(at, 0, rec.category); else state.categories.push(rec.category);
          state.budgets[rec.category] = 0;
        }
        const { undated, ...fields } = rec;
        state.expenses.push({ id: uid(), ...fields, photos: [], reimbursedAt: rec.reimbursement === 'reimbursed' ? now : null, createdAt: now, updatedAt: now });
      }
      summary = `Imported ${plural(results.length, 'expense')} (${money(sumBy(results, r => r.rec.total))}) from ${source}${imp.mode === 'replace' ? ' (replaced previous expenses)' : ''}`;
    } else if (type === 'dropins') {
      if (imp.mode === 'replace') state.dropIns = [];
      for (const { rec } of results) {
        const { undated, ...fields } = rec;
        state.dropIns.push({ id: uid(), ...fields, dateUnknown: undated, createdAt: now, updatedAt: now });
      }
      summary = `Imported ${plural(results.length, 'drop-in visit')} (${money(sumBy(results, r => r.rec.paid))} paid) from ${source}${imp.mode === 'replace' ? ' (replaced previous drop-ins)' : ''}`;
    } else {
      let toMembers = 0, toDropIns = 0, learned = 0;
      for (const { rec, target } of results) {
        if (target === 'dropin') {
          const open = state.dropIns.filter(d => samePerson(d.name, rec.name) && dropOwed(d) > 0).sort((a, b) => a.date.localeCompare(b.date))[0];
          if (open) Object.assign(open, { paid: round2(open.paid + rec.amount), method: rec.method, updatedAt: now });
          else state.dropIns.push({ id: uid(), name: tidyName(rec.name), date: rec.date, session: imp.dropSession.trim(), fee: rec.amount, paid: rec.amount, method: rec.method, notes: rec.notes || `Imported from ${source}`, createdAt: now, updatedAt: now });
          toDropIns++;
          continue;
        }
        const m = findMember(target);
        if (!m) continue;
        m.payments.push({ id: uid(), amount: rec.amount, method: rec.method, date: rec.date, note: rec.notes || `Imported from ${source}`, createdAt: now, updatedAt: now });
        m.updatedAt = now;
        if (imp.learnAliases && !memberNames(m).some(n => samePerson(n, rec.name))) { m.aliases.push(tidyName(rec.name)); learned++; }
        toMembers++;
      }
      summary = `Imported ${plural(results.length, 'payment')} (${money(sumBy(results, r => r.rec.amount))}) from ${source}: ${toMembers} from members, ${toDropIns} from drop-ins${learned ? `; learned ${plural(learned, 'other name')}` : ''}`;
    }
    ui.imp = freshImport();
    commit(summary, { type: 'import' });
    undoable(summary, snap, 'import from ' + source);
    goTab(type === 'payments' ? 'members' : type);
  };

  if (imp.mode === 'replace' && existingCount) {
    confirmDialog({
      title: 'Replace existing records?',
      message: `This deletes the ${plural(existingCount, IMPORT_NOUN[type])} currently in the tracker${type === 'members' ? ' (and all of their payments)' : ''} and replaces them with ${plural(results.length, 'imported row')}.`,
      confirmLabel: 'Replace',
      danger: true,
      onConfirm: run,
    });
  } else run();
}

  const imp = ui.imp;
  return `
  ${state.isSample ? `<div class="notice warn">${icon('alert')}<span class="notice-text">The sample team is still loaded. Erase it first so your real records don’t get mixed in with pretend ones.</span><button class="btn sm" data-tab="settings">Go to Settings</button></div>` : ''}
  ${imp.error ? `<div class="notice crit">${icon('alert')}<span class="notice-text">${esc(imp.error)}</span></div>` : ''}
  <div class="import-grid">
    <div>
      <label class="field"><span>What are you importing?</span>
        <select id="impTypeInput">
          ${[['auto', 'Work it out from what’s in it'], ...Object.entries(IMPORT_TYPES)].map(([v, l]) => `<option value="${v}" ${imp.type === v ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
      </label>
      <div class="dropzone" id="dropzone">
        ${icon('file')}

function previewTable(results, type) {
  const imp = ui.imp;
  const d = v => (v ? esc(v) : '<span class="muted">—</span>');
  const tick = r => `<input type="checkbox" data-row="${r.rowNum}" ${r.include ? 'checked' : ''} ${r.errors.length ? 'disabled' : ''} aria-label="Import row ${r.rowNum}">`;
  const result = r => {
    let main;
    if (r.errors.length) main = `<span class="res crit">${esc(r.errors.join('; '))}</span>`;
    else if (!r.include) main = '<span class="res">Not importing</span>';
    else if (r.dup && imp.dupMode === 'merge') main = '<span class="res ok">Adds to existing member</span>';
    else if (r.dup) main = '<span class="res ok">Added again</span>';
    else main = `<span class="res ok">${icon('check')} Ready</span>`;
    return main + (r.notes.length ? `<div class="muted small">${esc(r.notes.join(' · '))}</div>` : '');
  };
  const cls = r => (r.errors.length ? 'row-err' : !r.include ? 'row-skip' : '');
  const shown = results.slice(0, 250);
  if (type === 'payments') {
    const memberOpts = [...state.members].sort(byName).map(m => [m.id, m.name]);
    const who = r => `<select data-match="${r.rowNum}" ${r.errors.length ? 'disabled' : ''} aria-label="Who row ${r.rowNum} is from" style="min-width:170px">
        <option value="skip" ${r.target === 'skip' ? 'selected' : ''}>Don’t import</option>
        <option value="dropin" ${r.target === 'dropin' ? 'selected' : ''}>A drop-in (not a member)</option>
        ${memberOpts.length ? `<optgroup label="Members">${memberOpts.map(([id, n]) => `<option value="${id}" ${r.target === id ? 'selected' : ''}>${esc(n)}</option>`).join('')}</optgroup>` : ''}
      </select>`;
    const res = r => (r.errors.length ? `<span class="res crit">${esc(r.errors.join('; '))}</span>` : r.include ? `<span class="res ok">${icon('check')} Ready</span>` : '<span class="res">Not importing</span>')
      + (r.notes.length ? `<div class="muted small">${esc(r.notes.join(' · '))}</div>` : '');
    return `<table class="data"><thead><tr><th>Who is it?</th><th>Row</th><th>Date</th><th>Name on the payment</th><th class="num">Amount</th><th>Method</th><th>Result</th></tr></thead><tbody>
      ${shown.map(r => { const x = r.rec; return `<tr class="${cls(r)}"><td>${who(r)}</td><td class="muted">${r.rowNum}</td><td class="nowrap">${esc(fmtDate(x.date))}${x.undated ? ' <span class="muted small">(no date)</span>' : ''}</td><td class="strong">${d(x.name)}</td><td class="num">${money(x.amount)}</td><td>${esc(x.method)}</td><td>${res(r)}</td></tr>`; }).join('')}
    </tbody></table>`;
  }
  if (type === 'dropins') {
    return `<table class="data"><thead><tr><th></th><th>Row</th><th>Name</th><th>Date</th><th>Practice / event</th><th class="num">Charge</th><th class="num">Paid</th><th>Result</th></tr></thead><tbody>
      ${shown.map(r => { const x = r.rec; return `<tr class="${cls(r)}"><td>${tick(r)}</td><td class="muted">${r.rowNum}</td><td class="strong">${d(x.name)}</td><td class="nowrap">${esc(fmtDate(x.date))}${x.undated ? ' <span class="muted small">(no date)</span>' : ''}</td><td>${d(truncate(x.session, 60))}</td><td class="num">${money(x.fee)}</td><td class="num">${money(x.paid)}</td><td>${result(r)}</td></tr>`; }).join('')}
    </tbody></table>`;
  }
  if (type === 'members') {
    return `<table class="data"><thead><tr><th></th><th>Row</th><th>Name</th><th>Contact</th><th class="num">Fee</th><th class="num">Paid</th><th>Payments</th><th>Method</th><th>Paid on</th><th>Notes</th><th>Result</th></tr></thead><tbody>
      ${shown.map(r => { const x = r.rec; return `<tr class="${cls(r)}"><td>${tick(r)}</td><td class="muted">${r.rowNum}</td><td class="strong">${d(x.name)}</td><td>${d([x.email, x.phone].filter(Boolean).join(' · '))}</td><td class="num">${money(x.feeTarget)}</td><td class="num">${money(x.paid)}</td><td class="nowrap">${x.payments.length ? x.payments.map(a => money(a)).join(' + ') : '<span class="muted">—</span>'}</td><td>${x.paid > 0 ? esc(x.method) : '<span class="muted">—</span>'}</td><td class="nowrap">${x.paid > 0 ? esc(fmtDate(x.paymentDate)) + (x.undated ? ' <span class="muted small">(no date)</span>' : '') : '<span class="muted">—</span>'}</td><td>${d(truncate(x.notes, 40))}</td><td>${result(r)}</td></tr>`; }).join('')}
    </tbody></table>`;
  }
  return `<table class="data"><thead><tr><th></th><th>Row</th><th>Date</th><th>Description</th><th>Category</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Total</th><th>Method</th><th>Paid by</th><th>Reimbursement</th><th>Result</th></tr></thead><tbody>
    ${shown.map(r => { const x = r.rec; return `<tr class="${cls(r)}"><td>${tick(r)}</td><td class="muted">${r.rowNum}</td><td class="nowrap">${esc(fmtDate(x.date))}${x.undated ? ' <span class="muted small">(no date)</span>' : ''}</td><td class="strong">${d(truncate(x.description, 50))}</td><td>${esc(x.category)}</td><td class="num">${fmtQty(x.quantity)}</td><td class="num">${money(x.unitPrice)}</td><td class="num strong">${money(x.total)}</td><td>${esc(x.paymentMethod)}</td><td>${d(x.paidBy)}</td><td>${esc(REIMB_EXPORT[x.reimbursement])}</td><td>${result(r)}</td></tr>`; }).join('')}
  </tbody></table>`;
}

function csvCell(v) {
  if (v == null) return '';
  let s = String(v);
  if (typeof v === 'string' && /^[=+\-@\t\r]/.test(s) && !/^-?\d+(\.\d+)?$/.test(s)) s = "'" + s; // stop spreadsheet formula injection
  return /[",\r\n]/.test(s) || /^\s|\s$/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
const toCSV = rows => rows.map(r => r.map(csvCell).join(',')).join('\r\n');
function download(filename, content, mime = 'text/csv;charset=utf-8') {
  const blob = content instanceof Blob ? content : new Blob([mime.startsWith('text/csv') ? '﻿' + content : content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const fileSlug = () => normName(state.settings.teamName).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'team';

async function downloadBackup() {
  state.lastBackupAt = nowISO();
  save();
  const used = usedPhotoIds();
  let receipts = [], photoNote = '';
  if (used.size) {
    try {
      const stored = (await receiptAll()).filter(r => used.has(r.id));
      receipts = await Promise.all(stored.map(async r => ({ id: r.id, name: r.name, type: r.type, size: r.size, width: r.width, height: r.height, thumb: r.thumb, addedAt: r.addedAt, data: await blobToDataURL(r.blob) })));
      if (receipts.length < used.size) photoNote = ` ${used.size - receipts.length} photo(s) weren’t found in this browser.`;
    } catch (_) {
      photoNote = ' Receipt photos couldn’t be included from this browser.';
    }
  }
  const payload = { app: 'dragon-boat-finance-tracker', format: 2, exportedAt: state.lastBackupAt, data: state, receipts };
  download(`${fileSlug()}-backup-${todayStr()}.json`, JSON.stringify(payload), 'application/json');
  toast(`Backup downloaded${receipts.length ? ` with ${plural(receipts.length, 'receipt photo')}` : ''}. Keep it somewhere safe.${photoNote}`, { ms: photoNote ? 8000 : 4000 });
  render();
}
function readRestoreFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let obj;
    try { obj = JSON.parse(String(reader.result)); } catch (_) { toast('That file isn’t a tracker backup.', { error: true }); return; }
    const data = obj && obj.data ? obj.data : obj;
    if (!data || !Array.isArray(data.members) || !Array.isArray(data.expenses)) { toast('That file isn’t a tracker backup.', { error: true }); return; }
    const receipts = Array.isArray(obj.receipts) ? obj.receipts.filter(r => r && r.id && r.data) : [];
    const nPay = data.members.reduce((n, m) => n + (Array.isArray(m.payments) ? m.payments.length : 0), 0);
    confirmDialog({
      title: 'Restore this backup?',
      message: `Backup${obj.exportedAt ? ' from ' + fmtTS(obj.exportedAt) : ''}: ${plural(data.members.length, 'member')}, ${plural(nPay, 'payment')}, ${plural(data.expenses.length, 'expense')}${receipts.length ? `, ${plural(receipts.length, 'receipt photo')}` : ''}. It replaces everything currently in the tracker.`,
      confirmLabel: 'Restore backup',
      danger: true,
      onConfirm: async () => {
        let photoProblem = false;
        if (receipts.length) {
          try {
            for (const r of receipts) {
              const blob = dataURLToBlob(r.data);
              await receiptPut({ id: r.id, name: r.name, type: r.type || blob.type, size: r.size || blob.size, width: r.width, height: r.height, thumb: r.thumb || '', addedAt: r.addedAt || nowISO(), blob });
              thumbCache.delete(r.id);
            }
          } catch (_) { photoProblem = true; }
        }
        const snap = JSON.stringify(state);
        const theme = state.settings.theme;
        state = normalizeState(data);
        state.settings.theme = theme;
        commit(`Restored backup${obj.exportedAt ? ' from ' + fmtTS(obj.exportedAt) : ''}`, { type: 'import' });
        undoable('Backup restored', snap, 'restore backup');
        if (photoProblem) toast('The records were restored, but some receipt photos couldn’t be saved in this browser.', { error: true, ms: 9000 });
      },
    });
  };
  reader.readAsText(file);
}

function tabFromHash() {

  return TABS.some(([id]) => id === h) ? h : 'dashboard';

function goTab(id) {
  if (location.hash === '#' + id) { ui.tab = id; render(); }
  else location.hash = id;
}

});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action],[data-tab]');
  if (!el) {
    const row = e.target.closest('tr.member-row');
    if (row && !e.target.closest('button,a,input,select,label')) toggleMember(row.dataset.id);
    return;
  }
  if (el.disabled) return;
  if (el.dataset.tab) {
    if (el.closest('#modalRoot')) closeModal();
    goTab(el.dataset.tab);
    return;
  }
  const id = el.dataset.id;
  switch (el.dataset.action) {
    case 'record-payment': openPaymentModal(id); break;
    case 'edit-payment': openPaymentModal(el.dataset.member, id); break;
    case 'delete-payment': deletePayment(el.dataset.member, id); break;
    case 'add-member': openMemberModal(); break;
    case 'edit-member': openMemberModal(id); break;
    case 'delete-member': deleteMember(id); break;
    case 'toggle-member': toggleMember(id); break;
    case 'member-filter': ui.memberFilter = el.dataset.status; render(); break;
    case 'filter-members': ui.memberFilter = el.dataset.status; ui.memberSearch = ''; goTab('members'); break;
    case 'clear-member-filters': ui.memberFilter = 'all'; ui.memberSearch = ''; render(); break;
    case 'add-dropin': openDropInModal(); break;
    case 'edit-dropin': openDropInModal(id); break;
    case 'delete-dropin': deleteDropIn(id); break;
    case 'dropin-paid': { const d = state.dropIns.find(x => x.id === id); if (d) markDropInsPaid([d], d.name); break; }
    case 'person-visit': openDropInModal(null, el.dataset.name); break;
    case 'person-paid': markDropInsPaid(state.dropIns.filter(d => samePerson(d.name, el.dataset.name)), el.dataset.name); break;
    case 'make-member': makeMemberFromDropIn(el.dataset.name); break;
    case 'drop-view': ui.dropView = el.dataset.view; render(); break;
    case 'clear-drop-filters': ui.dropSearch = ''; ui.dropFilter = 'all'; render(); break;
    case 'add-plan': openPlanModal(); break;
    case 'edit-plan': openPlanModal(id); break;
    case 'delete-plan': deletePlan(id); break;
    case 'add-expense': openExpenseModal(); break;
    case 'edit-expense': openExpenseModal(id); break;
    case 'delete-expense': deleteExpense(id); break;
    case 'mark-reimbursed': markReimbursed(id); break;
    case 'view-receipt': openReceiptViewer(id, el.dataset.index); break;
    case 'clear-expense-filters': ui.expenseSearch = ''; ui.expenseCategory = 'all'; ui.expenseReimb = 'all'; ui.expensePhotos = 'all'; render(); break;
    case 'add-category': addCategory(); break;
    case 'rename-category': openRenameCategory(el.dataset.cat); break;
    case 'delete-category': openDeleteCategory(el.dataset.cat); break;
    case 'edit-float': openFloatModal(); break;
    case 'all-activity': openActivityModal(); break;
    case 'pick-import': $('#importFile').click(); break;
    case 'import-paste': {
      const text = $('#importPaste').value;
      if (!text.trim()) { ui.imp.error = 'Paste some rows into the box first.'; render(); }
      else { ui.imp.workbook = null; startImport(parseDelimited(text), 'pasted data'); }
      break;
    }
    case 'import-sheet': {
      const wb = ui.imp.workbook, s = wb && wb.sheets[Number(el.dataset.index)];
      if (s) startImport(s.rows, `${wb.fileName} › ${s.name}`);
      break;
    }
    case 'import-pick-another': ui.imp.stage = 'pick-sheet'; ui.imp.type = 'auto'; render(); break;
    case 'import-select-all': setAllTicks('all'); break;
    case 'import-select-none': setAllTicks('none'); break;
    case 'import-select-default': setAllTicks('default'); break;
    case 'import-reset': ui.imp = freshImport(); render(); break;
    case 'import-commit': doImport(); break;
    case 'template': downloadTemplate(el.dataset.kind); break;
    case 'export': exportCSV(el.dataset.kind); break;
    case 'export-all': exportAll(); break;
    case 'backup': downloadBackup(); break;
    case 'pick-restore': $('#restoreFile').click(); break;
    case 'load-sample': loadSample(); break;
    case 'erase-all': eraseAll(); break;

  if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
  if (e.key === 'Tab') { // keep keyboard focus inside the dialog
    const items = [...$('#modalRoot').querySelectorAll('button, input:not([type=hidden]):not([type=file]), select, textarea, [href]')].filter(x => !x.disabled && x.offsetParent !== null);
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

// Drag & drop: receipts onto an open expense, spreadsheets onto the Import page
document.addEventListener('dragover', e => {
  if (!e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
  e.preventDefault();
  const dz = $('#dropzone');
  if (dz && !modalIsOpen()) dz.classList.add('drag');
});
document.addEventListener('dragleave', e => {
  const dz = $('#dropzone');
  if (dz && !e.relatedTarget) dz.classList.remove('drag');
});
document.addEventListener('drop', e => {
  if (!e.dataTransfer || !e.dataTransfer.files.length) return;
  e.preventDefault();
  const dz = $('#dropzone');
  if (dz) dz.classList.remove('drag');
  if (modalIsOpen()) { if (modalDropHandler) modalDropHandler(e.dataTransfer.files); return; }
  if (ui.tab === 'data' && ui.imp.stage === 'input') readImportFile(e.dataTransfer.files[0]);
  else toast('To import a spreadsheet, go to Import / Export. To attach a receipt, open the expense first.');
});

// Keep several open tabs of the tracker in sync
window.addEventListener('storage', e => {
  if (e.key !== STORAGE_KEY || !e.newValue) return;
  try {
    state = normalizeState(JSON.parse(e.newValue));
    render();
  } catch (_) { /* ignore */ }
});

// Refresh relative times and overdue status every minute
setInterval(() => {
  if (modalIsOpen()) { renderHeader(); return; }
  if (ui.tab === 'dashboard') render(); else renderHeader();
}, 60000);

ui.tab = tabFromHash();
render();
cleanUpPhotos();
})();
</script>
</body>
</html>
