<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dragon Boat Finance Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>">
<style>
/* ---------- Design tokens ---------- */
:root {
  color-scheme: light;
  --page: #f3f3f0;
  --surface: #fcfcfb;
  --surface-2: #f0efec;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6b6a65;
  --hairline: #e1e0d9;
  --border: rgba(11, 11, 11, .12);
  --accent: #2a78d6;
  --accent-hover: #256abf;
  --accent-ink: #1c5cab;
  --accent-soft: #e6f0fc;
  --track: #cde2fb;
  --good: #0ca30c;
  --good-ink: #006300;
  --good-soft: rgba(12, 163, 12, .13);
  --warn: #fab219;
  --warn-icon: #b07800;
  --warn-ink: #6d4a00;
  --warn-soft: rgba(250, 178, 25, .22);
  --warn-track: #fbe6b8;
  --crit: #d03b3b;
  --crit-ink: #a82828;
  --crit-soft: rgba(208, 59, 59, .12);
  --crit-track: #f5d0d0;
  --overdue: #8a1c1c;
  --overdue-ink: #ffffff;
  --neutral-soft: rgba(11, 11, 11, .06);
  --shadow: 0 1px 2px rgba(16, 16, 16, .05), 0 2px 8px rgba(16, 16, 16, .04);
  --shadow-lg: 0 16px 48px rgba(0, 0, 0, .2);
  --focus: 0 0 0 3px rgba(42, 120, 214, .35);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #232321;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #9a988f;
    --hairline: #2c2c2a;
    --border: rgba(255, 255, 255, .10);
    --accent: #3987e5;
    --accent-hover: #5598e7;
    --accent-ink: #86b6ef;
    --accent-soft: rgba(57, 135, 229, .16);
    --track: #1d3352;
    --good-ink: #3fc23f;
    --good-soft: rgba(12, 163, 12, .2);
    --warn-icon: #fab219;
    --warn-ink: #fab219;
    --warn-soft: rgba(250, 178, 25, .18);
    --warn-track: #3b3017;
    --crit-ink: #f07a7a;
    --crit-soft: rgba(208, 59, 59, .22);
    --crit-track: #3d1f1f;
    --overdue: #7f1d1d;
    --overdue-ink: #ffe3e3;
    --neutral-soft: rgba(255, 255, 255, .08);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    --focus: 0 0 0 3px rgba(57, 135, 229, .45);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #232321;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #9a988f;
  --hairline: #2c2c2a;
  --border: rgba(255, 255, 255, .10);
  --accent: #3987e5;
  --accent-hover: #5598e7;
  --accent-ink: #86b6ef;
  --accent-soft: rgba(57, 135, 229, .16);
  --track: #1d3352;
  --good-ink: #3fc23f;
  --good-soft: rgba(12, 163, 12, .2);
  --warn-icon: #fab219;
  --warn-ink: #fab219;
  --warn-soft: rgba(250, 178, 25, .18);
  --warn-track: #3b3017;
  --crit-ink: #f07a7a;
  --crit-soft: rgba(208, 59, 59, .22);
  --crit-track: #3d1f1f;
  --overdue: #7f1d1d;
  --overdue-ink: #ffe3e3;
  --neutral-soft: rgba(255, 255, 255, .08);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  --focus: 0 0 0 3px rgba(57, 135, 229, .45);
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; }
p { margin: 0; }
.ic { width: 16px; height: 16px; flex: none; }
:focus-visible { outline: none; box-shadow: var(--focus); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.strong { font-weight: 600; }
.nowrap { white-space: nowrap; }
.good-text { color: var(--good-ink); }
.crit-text { color: var(--crit-ink); }
.spacer { flex: 1; }
[hidden] { display: none !important; }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--page);
  background: color-mix(in srgb, var(--page) 90%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--hairline);
}
.topbar-inner, .tabs, main { max-width: 1240px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }
.topbar-inner { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-top: 12px; padding-bottom: 8px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 38px; height: 38px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
.brand-mark .ic { width: 24px; height: 24px; }
.brand h1 { font-size: 16px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand .sub { font-size: 12px; color: var(--muted); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.updated {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2);
  background: var(--surface); border: 1px solid var(--border); padding: 5px 10px; border-radius: 999px;
}
.updated .ic { width: 14px; height: 14px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  appearance: none; border: 0; background: none; padding: 10px 12px; color: var(--ink-2); font-weight: 550;
  border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
main { padding-top: 20px; padding-bottom: 72px; }

/* ---------- Building blocks ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; }
#view > .card + .card, #view > .card + .grid-2, #view > .grid-2 + .card, #view > .grid-2 + .grid-2 { margin-top: 16px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.card-head h2 { font-size: 15px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.page-head { margin-bottom: 16px; }
.page-head h2 { font-size: 20px; font-weight: 650; margin-bottom: 4px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row-end { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px;
  border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--ink);
  font-weight: 550; cursor: pointer; white-space: nowrap; text-decoration: none;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn.danger { color: var(--crit-ink); }
.btn.danger:hover { background: var(--crit-soft); }
.btn.danger-solid { background: var(--crit); border-color: transparent; color: #fff; }
.btn.sm { height: 28px; padding: 0 9px; font-size: 13px; }
.btn.sm .ic { width: 14px; height: 14px; }
.icon-btn {
  width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 8px;
  border: 1px solid transparent; background: none; color: var(--ink-2); cursor: pointer; flex: none;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn.danger:hover { color: var(--crit-ink); background: var(--crit-soft); }
.icon-btn.sm { width: 26px; height: 26px; }
.icon-btn.sm .ic { width: 14px; height: 14px; }
.link { background: none; border: 0; padding: 0; color: var(--accent-ink); font-weight: 600; cursor: pointer; text-decoration: none; }
.link:hover { text-decoration: underline; }

input[type=text], input[type=search], input[type=number], input[type=date], input[type=email], input[type=tel], select, textarea {
  height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); min-width: 0; width: 100%;
}
select { padding-right: 6px; }
textarea { height: auto; padding: 8px 10px; resize: vertical; line-height: 1.4; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus); }
input:disabled { opacity: .55; }
.field { display: grid; gap: 5px; min-width: 0; align-content: start; }
.field > span, fieldset.field legend { font-size: 12px; font-weight: 600; color: var(--ink-2); }
fieldset.field { border: 0; padding: 0; margin: 0; }
fieldset.field legend { padding: 0; margin-bottom: 5px; }
.field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.hint { font-size: 12px; color: var(--muted); }
.hint.warn { color: var(--warn-ink); }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); flex: none; }

/* Badges & tags (status colour always paired with an icon + label) */
.badge {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 7px; border-radius: 999px;
  font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--ink);
}
.badge .ic { width: 14px; height: 14px; }
.b-paid { background: var(--good-soft); } .b-paid .ic { color: var(--good); }
.b-partial { background: var(--warn-soft); } .b-partial .ic { color: var(--warn-icon); }
.b-unpaid { background: var(--crit-soft); } .b-unpaid .ic { color: var(--crit); }
.b-overdue { background: var(--overdue); color: var(--overdue-ink); }
.b-nofee { background: var(--neutral-soft); color: var(--ink-2); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.tag .ic { width: 13px; height: 13px; }
.tag.good { background: var(--good-soft); } .tag.good .ic { color: var(--good); }
.tag.warn { background: var(--warn-soft); } .tag.warn .ic { color: var(--warn-icon); }
.tag.crit { background: var(--crit-soft); } .tag.crit .ic { color: var(--crit); }
.tag.neutral { background: var(--neutral-soft); color: var(--ink-2); }

/* Meters: fill carries severity, track is a lighter step of the same ramp */
.meter { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.meter > span { display: block; height: 100%; border-radius: 4px; background: var(--accent); transition: width .3s ease; }
.meter.lvl-near { background: var(--warn-track); } .meter.lvl-near > span { background: var(--warn); }
.meter.lvl-over { background: var(--crit-track); } .meter.lvl-over > span { background: var(--crit); }
.meter.lg { height: 12px; border-radius: 6px; } .meter.lg > span { border-radius: 6px; }

/* Notices */
.notice { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--accent-soft); margin-bottom: 16px; flex-wrap: wrap; }
.notice > .ic { width: 18px; height: 18px; color: var(--accent-ink); }
.notice.warn { background: var(--warn-soft); } .notice.warn > .ic { color: var(--warn-icon); }
.notice.crit { background: var(--crit-soft); } .notice.crit > .ic { color: var(--crit); }
.notice .notice-text { flex: 1 1 260px; }

/* ---------- Dashboard ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 32px; align-items: center; padding: 22px 26px; margin-bottom: 16px; }
.kpi-label, .label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.hero-value { font-size: 52px; font-weight: 650; letter-spacing: -.02em; line-height: 1.05; margin: 6px 0 10px; }
.hero-value.neg { color: var(--crit-ink); }
.formula { color: var(--ink-2); font-size: 13px; }
.hero-side { border-left: 1px solid var(--hairline); padding-left: 32px; display: grid; gap: 8px; }
.hero-side .row-between { display: flex; justify-content: space-between; align-items: baseline; }
.hero-side .pct { font-size: 22px; font-weight: 650; }
.status-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.status-count { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; cursor: pointer; font-weight: 650; border-radius: 999px; }
.status-count:hover .badge { filter: brightness(.96); }
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpis.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpi { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 22px; }
.kpi-value { font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
.kpi-sub { font-size: 12px; color: var(--muted); }
.kpi .icon-btn { width: 26px; height: 26px; margin: -4px -6px -4px 0; }
.kpi .icon-btn .ic { width: 14px; height: 14px; }
.cats { display: grid; gap: 14px; }
.cat-top, .cat-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.cat-top { margin-bottom: 6px; }
.cat-foot { margin-top: 5px; min-height: 20px; }
.cat-name { font-weight: 600; }
.cat-vals { font-variant-numeric: tabular-nums; white-space: nowrap; }
.feed { list-style: none; margin: 0; padding: 0; }
.feed-item { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--hairline); }
.feed-item:last-child { border-bottom: 0; }
.feed-ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); flex: none; }
.feed-ic .ic { width: 15px; height: 15px; }
.feed-ic.t-payment { background: var(--good-soft); color: var(--good-ink); }
.feed-ic.t-expense { background: var(--accent-soft); color: var(--accent-ink); }
.feed-ic.t-delete { background: var(--crit-soft); color: var(--crit-ink); }
.feed-body { flex: 1; min-width: 0; }
.feed-text { font-weight: 550; overflow-wrap: anywhere; }
.feed-amt { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.feed-amt.in { color: var(--good-ink); }
.steps { margin: 10px 0 12px; padding-left: 20px; display: grid; gap: 8px; }

/* ---------- Tables ---------- */
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.search { position: relative; flex: 1 1 220px; max-width: 320px; }
.search .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input { padding-left: 34px; }
.toolbar select { width: auto; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
  cursor: pointer; font-weight: 550; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2);
}
.chip:hover { color: var(--ink); }
.chip .count { font-size: 11px; background: var(--neutral-soft); padding: 1px 6px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip[aria-pressed="true"] .count { background: color-mix(in srgb, currentColor 22%, transparent); }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
table.data { width: 100%; border-collapse: collapse; min-width: 780px; }
table.data th {
  font-size: 12px; font-weight: 600; color: var(--ink-2); text-align: left; padding: 10px 12px;
  border-bottom: 1px solid var(--hairline); background: var(--surface-2); white-space: nowrap;
}
table.data td { padding: 10px 12px; border-bottom: 1px solid var(--hairline); vertical-align: middle; }
table.data tbody tr:last-child td { border-bottom: 0; }
table.data .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.data tfoot td { font-weight: 650; background: var(--surface-2); border-top: 1px solid var(--hairline); border-bottom: 0; }
td.actions { white-space: nowrap; text-align: right; }
td.actions > * { vertical-align: middle; }
tr.member-row { cursor: pointer; }
tr.member-row:hover > td { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.expander .ic { transition: transform .15s ease; }
tr.open .expander .ic { transform: rotate(90deg); }
tr.history-row > td { background: var(--surface-2); padding: 6px 16px 16px 54px; }
.history { display: grid; gap: 10px; }
.history-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-top: 8px; }
table.mini { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
table.mini th { font-size: 11px; font-weight: 600; color: var(--muted); text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--hairline); }
table.mini td { padding: 7px 10px; border-bottom: 1px solid var(--hairline); font-size: 13px; }
table.mini tr:last-child td { border-bottom: 0; }
table.mini .num { text-align: right; font-variant-numeric: tabular-nums; }
.item-cell { max-width: 320px; }
.empty { text-align: center; padding: 48px 20px; color: var(--ink-2); display: grid; justify-items: center; gap: 10px; }
.empty .ic { width: 32px; height: 32px; color: var(--muted); }
.empty h3 { font-size: 16px; color: var(--ink); }
.money-input { display: inline-flex; align-items: center; gap: 6px; }
.money-input input { width: 120px; text-align: right; }
.meter-cell { min-width: 170px; }
.meter-cell .meter { margin-bottom: 4px; }
.cat-cell { display: flex; align-items: center; gap: 6px; }
.cat-cell .icon-btn { opacity: .55; }
.cat-cell .icon-btn:hover, .cat-cell .icon-btn:focus-visible { opacity: 1; }
.add-cat { display: flex; gap: 8px; margin-top: 12px; max-width: 460px; }

/* Receipt photos */
.thumbs { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.thumb {
  width: 34px; height: 44px; padding: 0; border-radius: 5px; border: 1px solid var(--border); background: var(--surface-2);
  overflow: hidden; cursor: pointer; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: var(--ink-2);
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb:hover { border-color: var(--accent); }
.thumb-missing { font-size: 12px; color: var(--muted); }
.photo-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.photo-tile, .photo-add {
  position: relative; width: 84px; height: 108px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface-2); overflow: hidden; display: grid; place-items: center;
}
.photo-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-remove {
  position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; border: 0; padding: 0;
  background: rgba(0, 0, 0, .65); color: #fff; display: grid; place-items: center; cursor: pointer;
}
.photo-remove .ic { width: 12px; height: 12px; }
.photo-add { border-style: dashed; cursor: pointer; color: var(--ink-2); font-size: 12px; font-weight: 600; align-content: center; gap: 4px; }
.photo-add:hover { border-color: var(--accent); color: var(--accent-ink); }
.pdf-label { font-weight: 700; font-size: 12px; color: var(--crit-ink); }
.viewer { display: grid; gap: 10px; }
.viewer-stage { min-height: 280px; max-height: 66vh; display: grid; place-items: center; background: var(--surface-2); border-radius: 10px; overflow: auto; padding: 8px; text-align: center; }
.viewer-stage img { max-width: 100%; max-height: calc(66vh - 16px); object-fit: contain; display: block; }
.viewer-stage iframe { width: 100%; height: 62vh; border: 0; background: #fff; }
.viewer-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

/* Fee plans */
.plan-list { display: grid; margin-top: 12px; }
.plan-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--hairline); }
.inst-list { display: grid; gap: 8px; }
.inst-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1fr) 30px; gap: 8px; align-items: center; }

/* ---------- Import ---------- */
.import-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
.dropzone {
  margin-top: 12px; border: 1.5px dashed var(--border); border-radius: var(--radius); padding: 28px 16px; text-align: center;
  background: var(--surface-2); display: grid; justify-items: center; gap: 6px; transition: background .15s, border-color .15s;
}

function loadState() {

  } catch (e) {
    storageOK = false;
    storageMsg = 'This browser window is blocking storage (private/incognito mode or strict privacy settings), so changes will be lost when you close it. Open the tracker in a normal window, or download a backup before closing.';
    return defaultState();
  }
  if (!raw) return defaultState();
  try {
    return normalizeState(JSON.parse(raw));
  } catch (e) {
    try { localStorage.setItem(STORAGE_KEY + '.unreadable-' + Date.now(), raw); } catch (_) { /* ignore */ }
    storageMsg = 'Your saved data could not be read, so the tracker started fresh. A copy of the unreadable data was kept; restore your latest backup from Import / Export.';
    return defaultState();

}

/* ---------- Receipt photo storage (IndexedDB holds far more than localStorage) ---------- */
let idbPromise = null;
const thumbCache = new Map();
function idbOpen() {
  if (!idbPromise) {
    idbPromise = new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error('this browser can’t store photos')); return; }
      const req = indexedDB.open('dragonBoatFinanceTracker', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('receipts', { keyPath: 'id' });
      req.onsuccess = () => {
        const db = req.result;
        db.onversionchange = () => { db.close(); idbPromise = null; }; // let another tab upgrade or clear it
        resolve(db);
      };
      req.onerror = () => reject(req.error || new Error('photo storage is blocked in this browser'));
    });
    idbPromise.catch(() => { idbPromise = null; });
  }
  return idbPromise;
}
function idbRun(mode, fn) {
  return idbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('receipts', mode);
    const req = fn(tx.objectStore('receipts'));
    tx.oncomplete = () => resolve(req ? req.result : undefined);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('photo storage is full'));
  }));
}
const receiptPut = rec => idbRun('readwrite', st => st.put(rec));
const receiptGet = id => idbRun('readonly', st => st.get(id));
const receiptAll = () => idbRun('readonly', st => st.getAll());
const receiptKeys = () => idbRun('readonly', st => st.getAllKeys());
const receiptDeleteMany = ids => idbRun('readwrite', st => { ids.forEach(id => st.delete(id)); return null; });
const usedPhotoIds = () => new Set(state.expenses.flatMap(e => e.photos.map(p => p.id)));
function requestPersistentStorage() {

}

/** Shrinks a photo to a sensible size (receipts stay readable) and makes a small thumbnail. */
async function processReceiptFile(file) {
  const name = file.name || 'receipt';
  if (file.type === 'application/pdf' || /\.pdf$/i.test(name)) {
    if (file.size > 15 * 1024 * 1024) throw new Error(`“${name}” is over 15 MB.`);
    return { id: uid(), name, type: 'application/pdf', size: file.size, blob: file, thumb: '', addedAt: nowISO() };
  }
  if (!/^image\//.test(file.type) && !/\.(jpe?g|png|gif|webp|bmp|heic|heif)$/i.test(name)) throw new Error(`“${name}” isn’t a photo or a PDF.`);
  const url = URL.createObjectURL(file);
  try {
    // onload rather than img.decode(): decode() can stall while the page isn't painting (e.g. a background tab)
    const img = await new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = () => reject(new Error(`Couldn’t open “${name}”. iPhone HEIC photos need to be saved as JPEG first.`));
      im.src = url;
    });
    const scale = Math.min(1, MAX_PHOTO_EDGE / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    const blob = await new Promise((resolve, reject) => canvas.toBlob(b => (b ? resolve(b) : reject(new Error('Couldn’t process that photo.'))), 'image/jpeg', 0.82));
    const t = Math.min(1, 200 / Math.max(w, h));
    const tc = document.createElement('canvas');
    tc.width = Math.max(1, Math.round(w * t));
    tc.height = Math.max(1, Math.round(h * t));
    tc.getContext('2d').drawImage(canvas, 0, 0, tc.width, tc.height);
    const base = name.replace(/\.[^.]+$/, '') || 'receipt';
    return { id: uid(), name: base + '.jpg', type: 'image/jpeg', size: blob.size, width: w, height: h, blob, thumb: tc.toDataURL('image/jpeg', 0.75), addedAt: nowISO() };
  } finally {
    URL.revokeObjectURL(url);
  }
}

/** Fills in <img data-thumb="id"> placeholders once their thumbnails load from storage. */
function hydrateThumbs(root = document) {
  for (const img of root.querySelectorAll('img[data-thumb]:not([src])')) {
    const id = img.dataset.thumb;
    if (thumbCache.has(id)) { setThumb(img, thumbCache.get(id)); continue; }
    receiptGet(id)
      .then(rec => { const t = rec ? rec.thumb || '' : null; thumbCache.set(id, t); setThumb(img, t); })
      .catch(() => setThumb(img, null));
  }
}
function setThumb(img, src) {
  if (src) img.src = src;
  else if (src === null && img.isConnected) {
    const span = document.createElement('span');
    span.className = 'thumb-missing';
    span.textContent = '?';
    span.title = 'This photo isn’t stored in this browser';
    img.replaceWith(span);
  }
}

/* =====================================================================
   Calculations
   ===================================================================== */
const cats = () => state.categories;
const fallbackCategory = () => (cats().includes('Miscellaneous') ? 'Miscellaneous' : cats()[cats().length - 1]);
const findMember = id => state.members.find(m => m.id === id);
const memberPaid = m => sumBy(m.payments, p => p.amount);
const memberBalance = m => round2(m.feeTarget - memberPaid(m));
const memberDue = m => m.dueDate || state.settings.defaultDueDate || '';
const planTotal = p => sumBy(p.installments, i => i.amount);
const memberPlan = m => (m.planId ? state.feePlans.find(p => p.id === m.planId) || null : null);
const planSummary = p => p.installments.map(i => `${money(i.amount)}${i.dueDate ? ' by ' + fmtDate(i.dueDate) : ''}`).join(' · ');

/* Name matching: "SMITH-JONES, ANNA", "Anna Smith-Jones" and "ANNASMITHJONES" all count as the same person. */
const foldName = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
const tokenKey = s => foldName(s).split(' ').filter(Boolean).sort().join(' ');
const compactKey = s => foldName(s).replace(/\s/g, '');
const samePerson = (a, b) => !!tokenKey(a) && (tokenKey(a) === tokenKey(b) || compactKey(a) === compactKey(b));
const memberNames = m => [m.name, ...m.aliases];
/** The one member whose name or other names match, or null if none (or more than one) do. */
function matchMember(name) {
  if (!tokenKey(name)) return null;
  const hits = state.members.filter(m => memberNames(m).some(n => samePerson(n, name)));
  return hits.length === 1 ? hits[0] : null;
}
function parseAliases(text, mainName) {
  const out = [];
  for (const raw of String(text ?? '').split(/[;\n]/)) { // not commas: bank names often read "LAU, KA YAN"
    const a = raw.trim().replace(/\s+/g, ' ');
    if (a && !samePerson(a, mainName) && !out.some(x => samePerson(x, a))) out.push(a);
  }
  return out;
}
/** Bank lists often SHOUT names; store them as "Yveth Valdez Gameng". */
const tidyName = s => { const t = String(s ?? '').trim().replace(/\s+/g, ' '); return t && t === t.toUpperCase() && /[A-Z]/.test(t) ? t.toLowerCase().replace(/(^|[\s\-'’])(\p{L})/gu, (m, p, c) => p + c.toUpperCase()) : t; };

/* Drop-ins: one record per person per visit */
const dropOwed = d => Math.max(0, round2(d.fee - d.paid));
const dropStatus = d => (d.fee <= 0 ? (d.paid > 0 ? 'paid' : 'free') : d.paid >= d.fee - 0.004 ? 'paid' : d.paid > 0 ? 'partial' : 'unpaid');
function dropInPeople() {
  const groups = [];
  for (const d of state.dropIns) {
    let g = groups.find(x => samePerson(x.visits[0].name, d.name));
    if (!g) groups.push(g = { visits: [] });
    g.visits.push(d);
  }
  return groups.map(g => {
    g.visits.sort((a, b) => a.date.localeCompare(b.date) || a.createdAt.localeCompare(b.createdAt));
    const last = g.visits[g.visits.length - 1];
    return { name: last.name, visits: g.visits, last: last.date, charged: sumBy(g.visits, v => v.fee), paid: sumBy(g.visits, v => v.paid), owed: sumBy(g.visits, dropOwed), member: matchMember(last.name) };
  });
}

/** A member's installments, scaled to their own fee (the last installment absorbs any discount or extra). */
function scheduleFor(m) {
  const plan = memberPlan(m);
  if (!plan) return null;
  let cumulative = 0;
  return plan.installments.map((ins, i, all) => {
    const left = Math.max(0, round2(m.feeTarget - cumulative));
    const amount = round2(i === all.length - 1 ? left : Math.min(ins.amount, left));
    cumulative = round2(cumulative + amount);
    return { number: i + 1, of: all.length, amount, dueDate: ins.dueDate, cumulative };
  });
}
/** How much this member should have paid by today. */
function amountDueNow(m) {
  const today = todayStr();
  const schedule = scheduleFor(m);
  if (schedule) return schedule.reduce((due, s) => (s.dueDate && s.dueDate < today ? Math.max(due, s.cumulative) : due), 0);
  const d = memberDue(m);
  return d && d < today ? m.feeTarget : 0;
}
function nextInstallment(m) {
  const schedule = scheduleFor(m);
  if (!schedule) return null;
  const paid = memberPaid(m);
  const s = schedule.find(x => x.amount > 0 && x.cumulative > paid + 0.004);
  return s ? { ...s, remaining: round2(Math.min(s.amount, s.cumulative - paid)) } : null;
}
function memberStatus(m) {
  const paid = memberPaid(m);
  if (m.feeTarget <= 0) return paid > 0 ? 'paid' : 'nofee';
  if (paid >= m.feeTarget - 0.004) return 'paid';
  if (paid < amountDueNow(m) - 0.004) return 'overdue';
  return paid > 0 ? 'partial' : 'unpaid';
}
const overdueAmount = m => (memberStatus(m) === 'overdue' ? round2(amountDueNow(m) - memberPaid(m)) : 0);
function suggestedPayment(m) {
  const next = nextInstallment(m);
  if (next) return next.remaining;
  const b = memberBalance(m);
  return b > 0 ? b : '';
}
function latestPayment(m) {
  return m.payments.reduce((a, p) => (!a || p.date > a.date || (p.date === a.date && p.createdAt > a.createdAt) ? p : a), null);
}
function statusCounts() {
  const c = { paid: 0, partial: 0, unpaid: 0, overdue: 0, nofee: 0 };
  for (const m of state.members) c[memberStatus(m)]++;
  return c;
}
function totals() {
  const ms = state.members, ex = state.expenses;
  const collected = sumBy(ms, memberPaid);
  const expected = sumBy(ms, m => m.feeTarget);
  const outstanding = sumBy(ms, m => Math.max(0, memberBalance(m)));
  const overdue = sumBy(ms, overdueAmount);
  const expenses = sumBy(ex, e => e.total);
  const pending = sumBy(ex.filter(e => e.reimbursement === 'pending'), e => e.total);
  const float = state.float.amount;
  const dropIns = sumBy(state.dropIns, d => d.paid);
  const dropOwing = sumBy(state.dropIns, dropOwed);
  const net = round2(float + collected + dropIns - expenses);
  return { collected, expected, outstanding, overdue, expenses, pending, float, dropIns, dropOwing, net, cash: round2(net + pending) };
}
function categorySpend() {
  const o = Object.fromEntries(cats().map(c => [c, 0]));
  for (const e of state.expenses) o[e.category] = round2((o[e.category] || 0) + e.total);
  return o;
}
function budgetLevel(spent, budget) {
  if (budget <= 0) return spent > 0 ? 'nobudget' : 'none';
  const pct = (spent / budget) * 100;
  if (pct > 100) return 'over';
  if (pct >= state.settings.budgetWarnPct) return 'near';
  return 'ok';
}

  const pct = t.expected > 0 ? (t.collected / t.expected) * 100 : 0;
  const payments = state.members.reduce((n, m) => n + m.payments.length, 0);
  const payers = state.members.filter(m => m.payments.length).length;
  const owing = state.members.filter(m => memberBalance(m) > 0).length;
  const pendingCount = state.expenses.filter(e => e.reimbursement === 'pending').length;
  const isEmpty = !state.members.length && !state.expenses.length;
  const hasData = state.members.length || state.expenses.length;

  let notices = '';
  if (state.isSample) {
    notices += `<div class="notice">${icon('alertCircle')}<span class="notice-text">You’re looking at <strong>sample data</strong>. When you’re ready to enter your real team, erase it from Settings.</span><button class="btn sm" data-tab="settings">Go to Settings</button></div>`;
  } else if (hasData && daysSince(state.lastBackupAt) > BACKUP_NAG_DAYS) {
    notices += `<div class="notice warn">${icon('shield')}<span class="notice-text">Your records live only in this browser. <strong>Last backup: ${state.lastBackupAt ? esc(relTime(state.lastBackupAt)) : 'never'}.</strong> Download one so nothing is lost if browser data gets cleared.</span><button class="btn sm" data-action="backup">${icon('download')}Download backup</button></div>`;
  }

  const gettingStarted = isEmpty ? `
    <section class="card" style="margin-bottom:16px">
      <div class="card-head"><h2>Welcome! Let’s set up your team’s books</h2></div>
      <ol class="steps">
        <li><strong>Set your starting float</strong>: the cash and bank balance you’re starting with. <button class="link" data-action="edit-float">Set float</button></li>
        <li><strong>Set up your fee plans</strong>, like “Full season $800 in 3 payments”. <button class="link" data-tab="settings">Fee plans</button></li>
        <li><strong>Add your members</strong>, or bring them over from your spreadsheet (.xlsx or CSV). <button class="link" data-tab="members">Add members</button> · <button class="link" data-tab="data">Import a spreadsheet</button></li>
        <li><strong>Set a budget</strong> for each spending category. <button class="link" data-tab="budget">Set budgets</button></li>
        <li><strong>Record payments and expenses</strong> as they happen, with receipt photos, using the buttons at the top.</li>
      </ol>
      <p class="muted">Want to look around first? <button class="link" data-action="load-sample">Load sample data</button> (you can erase it afterwards in Settings).</p>
    </section>` : '';

  const statusButtons = ['paid', 'partial', 'unpaid', 'overdue']
    .map(s => `<button class="status-count" data-action="filter-members" data-status="${s}" title="Show ${STATUS[s].label.toLowerCase()} members">${badge(s)}${c[s]}</button>`).join('');

  const floatAction = `<button class="icon-btn" data-action="edit-float" title="Edit starting float" aria-label="Edit starting float">${icon('pencil')}</button>`;
  const spend = categorySpend();
  const totalBudget = sumBy(cats(), k => state.budgets[k]);
  const outstandingSub = owing
    ? `${plural(owing, 'member')} still owe${c.overdue ? ` · ${c.overdue} overdue (${money(t.overdue)})` : ''}`
    : state.members.length ? 'Everyone is paid up' : 'No members yet';

  return `
  ${notices}
  ${gettingStarted}
  <section class="card hero">
    <div>
      <div class="label">Net balance</div>
      <div class="hero-value ${t.net < 0 ? 'neg' : ''}">${money(t.net)}</div>
      <div class="formula">${money(t.float)} starting float + ${money(t.collected)} fees collected${t.dropIns ? ` + ${money(t.dropIns)} drop-ins` : ''} − ${money(t.expenses)} expenses</div>
      ${t.pending > 0 ? `<div class="formula" style="margin-top:4px">Cash on hand right now: <strong>${money(t.cash)}</strong>, since ${money(t.pending)} is still owed back to people who paid out of pocket.</div>` : ''}
    </div>
    <div class="hero-side">
      <div class="row-between"><span class="label">Fee collection</span><span class="pct">${t.expected > 0 ? fmtPct(pct) : '—'}</span></div>
      ${meter(pct, 'ok', `Fees collected: ${money(t.collected)} of ${money(t.expected)}`, 'lg')}
      <div class="formula">${t.expected > 0 ? `${money(t.collected)} collected of ${money(t.expected)} expected` : 'Add members with fee targets to track collection.'}</div>
      ${state.members.length ? `<div class="status-row">${statusButtons}</div>` : ''}
    </div>
  </section>

  <section class="kpis">
    ${kpi('Starting float', money(t.float), state.float.updatedAt ? `Updated ${esc(fmtTS(state.float.updatedAt))}` : 'Not set yet', floatAction)}
    ${kpi('Fees collected', money(t.collected), `${plural(payments, 'payment')} from ${plural(payers, 'member')}`)}
    ${kpi('Fees outstanding', money(t.outstanding), outstandingSub)}
    ${kpi('Drop-in income', money(t.dropIns), state.dropIns.length ? `${plural(state.dropIns.length, 'visit')}${t.dropOwing ? ` · ${money(t.dropOwing)} still owed` : ''}` : 'No drop-ins yet', `<button class="icon-btn" data-tab="dropins" title="Go to drop-ins" aria-label="Go to drop-ins">${icon('chevron')}</button>`)}
    ${kpi('Total expenses', money(t.expenses), `${plural(state.expenses.length, 'expense')}${totalBudget > 0 ? ` · ${fmtPct((t.expenses / totalBudget) * 100)} of budget` : ''}`)}
    ${kpi('Pending reimbursements', money(t.pending), pendingCount ? `${plural(pendingCount, 'expense')} to pay back` : 'Nothing owed back')}
  </section>

  <div class="grid-2">
    <section class="card">
      <div class="card-head"><h2>Spending by category</h2><button class="link" data-tab="budget">Edit budgets</button></div>
      ${totalBudget <= 0 && !state.expenses.length ? '<p class="muted" style="margin-bottom:12px">Set a budget for each category to see how spending is tracking.</p>' : ''}
      <div class="cats">${cats().map(k => categoryRow(k, spend[k] || 0, state.budgets[k] || 0)).join('')}</div>
    </section>
    <section class="card">
      <div class="card-head"><h2>Recent activity</h2>${state.activity.length > 10 ? '<button class="link" data-action="all-activity">View all</button>' : ''}</div>
      ${activityFeed(10)}
    </section>
  </div>`;
}

function categoryRow(cat, spent, budget) {
  const level = budgetLevel(spent, budget);
  const pct = budget > 0 ? (spent / budget) * 100 : 0;
  const vals = budget > 0
    ? `<strong>${money(spent)}</strong> <span class="muted">/ ${money(budget)}</span>`
    : `<strong>${money(spent)}</strong>`;
  let foot;
  if (budget > 0) foot = `${fmtPct(pct)} used · ${spent <= budget ? money(budget - spent) + ' left' : money(spent - budget) + ' over'}`;
  else foot = spent > 0 ? 'Set a budget to track this' : 'No spending yet';
  return `<div class="cat">
    <div class="cat-top"><span class="cat-name">${esc(cat)}</span><span class="cat-vals">${vals}</span></div>
    ${meter(pct, level, budget > 0 ? `${cat}: ${money(spent)} of ${money(budget)} (${fmtPct(pct)})` : `${cat}: ${money(spent)} spent, no budget set`)}
    <div class="cat-foot"><span class="muted small">${foot}</span>${levelTag(level, pct)}</div>
  </div>`;
}

function activityFeed(limit) {
  const items = state.activity.slice(0, limit);
  if (!items.length) return '<p class="muted">Nothing yet. Payments and expenses you record will show up here.</p>';
  return `<ul class="feed">${items.map(a => {
    const sign = a.dir === 'in' ? '+' : a.dir === 'out' ? '−' : '';
    const amt = a.amount != null ? `<span class="feed-amt ${a.dir || ''}">${sign}${money(Math.abs(a.amount))}</span>` : '';
    return `<li class="feed-item"><span class="feed-ic t-${esc(a.type)}">${icon(ACT_ICON[a.type] || 'clock')}</span>
      <div class="feed-body"><div class="feed-text">${esc(a.text)}</div><time class="muted small" datetime="${esc(a.at)}">${esc(relTime(a.at))} · ${esc(fmtTS(a.at))}</time></div>${amt}</li>`;
  }).join('')}</ul>`;
}

/* ---------- Members ---------- */
function viewMembers() {
  const c = statusCounts();
  const chip = (key, label, n) => `<button class="chip" data-action="member-filter" data-status="${key}" aria-pressed="${ui.memberFilter === key}">${label}<span class="count">${n}</span></button>`;
  return `
  <div class="toolbar">
    <div class="search">${icon('search')}<input type="search" id="memberSearch" placeholder="Search by name, email, plan…" value="${esc(ui.memberSearch)}" aria-label="Search members"></div>
    <div class="chips" role="group" aria-label="Filter by payment status">
      ${chip('all', 'All', state.members.length)}${['paid', 'partial', 'unpaid', 'overdue'].map(s => chip(s, STATUS[s].label, c[s])).join('')}
    </div>
    <div class="spacer"></div>
    <select id="memberSort" aria-label="Sort members">
      ${[['name', 'Name (A–Z)'], ['balance', 'Balance owing'], ['status', 'Status'], ['due', 'Next due date'], ['recent', 'Most recent payment']].map(([v, l]) => `<option value="${v}" ${ui.memberSort === v ? 'selected' : ''}>Sort: ${l}</option>`).join('')}
    </select>
    <button class="btn primary" data-action="add-member">${icon('plus')}Add member</button>
  </div>
  ${!state.feePlans.length && state.members.length ? `<p class="hint" style="margin:-4px 0 12px">Tip: set up <button class="link" data-tab="settings">fee plans</button> (like Full season $800 in 3 payments) so installments and overdue payments are tracked automatically.</p>` : ''}
  <div id="membersTable">${membersTable()}</div>`;
}

function nextDueDate(m) {
  const n = nextInstallment(m);
  if (n) return n.dueDate || '9999';
  return memberBalance(m) > 0 ? memberDue(m) || '9999' : '9999';
}

function filteredMembers() {
  const q = ui.memberSearch.trim().toLowerCase();
  const list = state.members.filter(m =>
    (ui.memberFilter === 'all' || memberStatus(m) === ui.memberFilter) &&
    (!q || [m.name, ...m.aliases, m.email, m.phone, m.notes, memberPlan(m)?.name].join(' ').toLowerCase().includes(q)));
  const sorters = {
    name: byName,
    balance: (a, b) => memberBalance(b) - memberBalance(a) || byName(a, b),
    status: (a, b) => STATUS_ORDER[memberStatus(a)] - STATUS_ORDER[memberStatus(b)] || byName(a, b),
    due: (a, b) => nextDueDate(a).localeCompare(nextDueDate(b)) || byName(a, b),
    recent: (a, b) => {
      const pa = latestPayment(a), pb = latestPayment(b);
      return (pb ? pb.date + pb.createdAt : '').localeCompare(pa ? pa.date + pa.createdAt : '') || byName(a, b);
    },
  };
  return list.sort(sorters[ui.memberSort] || byName);
}

function dueCell(m) {
  if (memberPlan(m)) {
    const next = nextInstallment(m);
    if (!next) return '<span class="muted">—</span>';
    return `<span class="nowrap">${next.dueDate ? esc(fmtDate(next.dueDate)) : 'No date set'}</span><div class="muted small nowrap">${money(next.remaining)} · payment ${next.number} of ${next.of}</div>`;
  }
  const due = memberDue(m);
  if (!due) return '<span class="muted">—</span>';
  return `<span class="nowrap">${esc(fmtDate(due))}</span>${m.dueDate ? '' : '<div class="muted small">team date</div>'}`;
}

function membersTable() {
  if (!state.members.length) {
    return `<div class="card">${emptyState('users', 'No members yet', 'Add your paddlers one at a time, or import them from your existing spreadsheet.',
      `<button class="btn primary" data-action="add-member">${icon('plus')}Add member</button><button class="btn" data-tab="data">${icon('upload')}Import spreadsheet</button>`)}</div>`;
  }
  const list = filteredMembers();
  if (!list.length) {
    return `<div class="card">${emptyState('search', 'No members match', 'Try a different search or status filter.', '<button class="btn" data-action="clear-member-filters">Clear filters</button>')}</div>`;
  }
  const rows = list.map(m => {
    const paid = memberPaid(m), bal = round2(m.feeTarget - paid), open = ui.expanded.has(m.id), plan = memberPlan(m);
    const status = memberStatus(m);
    const contact = [m.email, m.phone].filter(Boolean).map(esc).join(' · ');
    const balCell = bal > 0 ? money(bal) : bal < 0 ? `<span class="good-text">Credit ${money(-bal)}</span>` : '<span class="muted">—</span>';
    return `<tr class="member-row ${open ? 'open' : ''}" data-id="${m.id}">
      <td style="width:44px"><button class="icon-btn expander" data-action="toggle-member" data-id="${m.id}" aria-expanded="${open}" aria-label="${open ? 'Hide' : 'Show'} payment history for ${esc(m.name)}">${icon('chevron')}</button></td>
      <td><div class="strong">${esc(m.name)}</div>${m.aliases.length ? `<div class="muted small">aka ${m.aliases.map(esc).join(' · ')}</div>` : ''}${contact ? `<div class="muted small">${contact}</div>` : ''}</td>
      <td class="num">${money(m.feeTarget)}${plan ? `<div class="muted small">${esc(plan.name)}</div>` : ''}</td>
      <td class="num">${money(paid)}</td>
      <td class="num">${balCell}</td>
      <td>${dueCell(m)}</td>
      <td>${badge(status, status === 'overdue' ? `${money(overdueAmount(m))} overdue` : '')}</td>
      <td class="actions">
        <button class="btn sm" data-action="record-payment" data-id="${m.id}">${icon('plus')}Payment</button>
        <button class="icon-btn" data-action="edit-member" data-id="${m.id}" title="Edit member" aria-label="Edit ${esc(m.name)}">${icon('pencil')}</button>
        <button class="icon-btn danger" data-action="delete-member" data-id="${m.id}" title="Remove member" aria-label="Remove ${esc(m.name)}">${icon('trash')}</button>
      </td>
    </tr>${open ? `<tr class="history-row"><td colspan="8">${paymentHistory(m)}</td></tr>` : ''}`;
  }).join('');
  const expected = sumBy(list, m => m.feeTarget), paid = sumBy(list, memberPaid), outstanding = sumBy(list, m => Math.max(0, memberBalance(m)));
  return `<div class="table-wrap"><table class="data">
    <thead><tr><th></th><th>Member</th><th class="num">Fee</th><th class="num">Paid</th><th class="num">Balance</th><th>Next due</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td></td><td>${list.length === state.members.length ? plural(list.length, 'member') : `${list.length} of ${state.members.length} members`}</td><td class="num">${money(expected)}</td><td class="num">${money(paid)}</td><td class="num">${money(outstanding)}</td><td colspan="3"></td></tr></tfoot>
  </table></div>`;
}

function paymentHistory(m) {
  const pays = [...m.payments].sort((a, b) => b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt));
  const meta = `Member added ${esc(fmtTS(m.createdAt))}${m.updatedAt !== m.createdAt ? ` · last updated ${esc(fmtTS(m.updatedAt))}` : ''}`;
  const schedule = scheduleFor(m);
  const paid = memberPaid(m);
  const scheduleHtml = schedule ? `<div class="small"><strong>${esc(memberPlan(m).name)} plan:</strong> ${schedule.map(s => {
    const done = paid >= s.cumulative - 0.004;
    const late = !done && s.dueDate && s.dueDate < todayStr();
    return `<span class="${done ? 'good-text' : late ? 'crit-text' : ''}">${done ? '✓ ' : ''}${money(s.amount)}${s.dueDate ? ' by ' + esc(fmtDate(s.dueDate)) : ''}${late ? ' (late)' : ''}</span>`;
  }).join(' · ')}</div>` : '';
  const table = pays.length ? `<table class="mini">
      <thead><tr><th>Date received</th><th class="num">Amount</th><th>Method</th><th>Note</th><th>Recorded</th><th></th></tr></thead>
      <tbody>${pays.map(p => `<tr>
        <td class="nowrap">${esc(fmtDate(p.date))}</td>
        <td class="num strong">${money(p.amount)}</td>
        <td>${esc(p.method)}</td>
        <td>${esc(p.note) || '<span class="muted">—</span>'}</td>
        <td class="muted small nowrap">${esc(fmtTS(p.createdAt))}${p.updatedAt !== p.createdAt ? `<br>Edited ${esc(fmtTS(p.updatedAt))}` : ''}</td>
        <td class="actions"><button class="icon-btn" data-action="edit-payment" data-member="${m.id}" data-id="${p.id}" title="Edit payment" aria-label="Edit payment">${icon('pencil')}</button><button class="icon-btn danger" data-action="delete-payment" data-member="${m.id}" data-id="${p.id}" title="Delete payment" aria-label="Delete payment">${icon('trash')}</button></td>
      </tr>`).join('')}</tbody></table>`
    : '<p class="muted">No payments recorded yet.</p>';
  return `<div class="history">
    <div class="history-head"><strong>Payment history</strong><span class="muted small">${meta}</span></div>
    ${scheduleHtml}
    ${table}
    ${m.notes ? `<p class="small"><strong>Notes:</strong> ${esc(m.notes)}</p>` : ''}
  </div>`;
}

/* ---------- Expenses ---------- */
function viewExpenses() {
  return `
  <div class="toolbar">
    <div class="search">${icon('search')}<input type="search" id="expenseSearch" placeholder="Search expenses…" value="${esc(ui.expenseSearch)}" aria-label="Search expenses"></div>
    <select id="expCategory" aria-label="Filter by category">
      <option value="all">All categories</option>
      ${cats().map(c => `<option value="${esc(c)}" ${ui.expenseCategory === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}
    </select>
    <select id="expReimb" aria-label="Filter by reimbursement">
      ${[['all', 'Any reimbursement status'], ['pending', 'Pending reimbursement'], ['reimbursed', 'Reimbursed'], ['none', 'Paid from team funds']].map(([v, l]) => `<option value="${v}" ${ui.expenseReimb === v ? 'selected' : ''}>${l}</option>`).join('')}
    </select>
    <select id="expPhotos" aria-label="Filter by receipt photos">
      ${[['all', 'With or without receipts'], ['with', 'Has receipt photos'], ['missing', 'Missing receipt photos']].map(([v, l]) => `<option value="${v}" ${ui.expensePhotos === v ? 'selected' : ''}>${l}</option>`).join('')}
    </select>
    <select id="expSort" aria-label="Sort expenses">
      ${[['newest', 'Newest first'], ['oldest', 'Oldest first'], ['highest', 'Highest amount'], ['category', 'Category']].map(([v, l]) => `<option value="${v}" ${ui.expenseSort === v ? 'selected' : ''}>Sort: ${l}</option>`).join('')}
    </select>
    <div class="spacer"></div>
    <button class="btn primary" data-action="add-expense">${icon('plus')}Add expense</button>
  </div>
  <div id="expensesTable">${expensesTable()}</div>`;
}

function filteredExpenses() {
  const q = ui.expenseSearch.trim().toLowerCase();
  const list = state.expenses.filter(e =>
    (ui.expenseCategory === 'all' || e.category === ui.expenseCategory) &&
    (ui.expenseReimb === 'all' || e.reimbursement === ui.expenseReimb) &&
    (ui.expensePhotos === 'all' || (ui.expensePhotos === 'with' ? e.photos.length > 0 : e.photos.length === 0)) &&
    (!q || [e.description, e.notes, e.paidBy, e.receipt, e.category, e.paymentMethod, ...e.photos.map(p => p.name)].join(' ').toLowerCase().includes(q)));
  const newest = (a, b) => b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt);
  const sorters = {
    newest,
    oldest: (a, b) => -newest(a, b),
    highest: (a, b) => b.total - a.total || newest(a, b),
    category: (a, b) => cats().indexOf(a.category) - cats().indexOf(b.category) || newest(a, b),
  };
  return list.sort(sorters[ui.expenseSort] || newest);
}

function expensesTable() {
  if (!state.expenses.length) {
    return `<div class="card">${emptyState('receipt', 'No expenses yet', 'Record what the team spends: boat rentals, coaching, regatta entries, equipment and so on. Snap a photo of each receipt as you go.',
      `<button class="btn primary" data-action="add-expense">${icon('plus')}Add expense</button><button class="btn" data-tab="data">${icon('upload')}Import spreadsheet</button>`)}</div>`;
  }
  const list = filteredExpenses();
  if (!list.length) {
    return `<div class="card">${emptyState('search', 'No expenses match', 'Try a different search, category or status.', '<button class="btn" data-action="clear-expense-filters">Clear filters</button>')}</div>`;
  }
  const rows = list.map(e => {
    const edited = e.updatedAt !== e.createdAt;
    return `<tr>
      <td class="nowrap">${esc(fmtDate(e.date))}</td>
      <td class="item-cell"><div class="strong">${esc(e.description)}</div>${e.notes ? `<div class="muted small">${esc(e.notes)}</div>` : ''}${e.receipt ? `<div class="muted small">Ref: ${esc(e.receipt)}</div>` : ''}${photoStrip(e)}</td>
      <td>${esc(e.category)}</td>
      <td class="num muted">${fmtQty(e.quantity)} × ${money(e.unitPrice)}</td>
      <td class="num strong">${money(e.total)}</td>
      <td><div class="nowrap">${esc(e.paymentMethod)}</div>${e.paidBy ? `<div class="muted small">by ${esc(e.paidBy)}</div>` : ''}</td>
      <td>${reimbBadge(e)}${e.reimbursement === 'pending' ? `<div style="margin-top:4px"><button class="link small" data-action="mark-reimbursed" data-id="${e.id}">Mark reimbursed</button></div>` : ''}</td>
      <td class="muted small nowrap" title="Added ${esc(fmtTS(e.createdAt))}${edited ? ' · Edited ' + esc(fmtTS(e.updatedAt)) : ''}">${edited ? 'Edited' : 'Added'}<br>${esc(fmtTS(e.updatedAt))}</td>
      <td class="actions"><button class="icon-btn" data-action="edit-expense" data-id="${e.id}" title="Edit expense" aria-label="Edit expense">${icon('pencil')}</button><button class="icon-btn danger" data-action="delete-expense" data-id="${e.id}" title="Delete expense" aria-label="Delete expense">${icon('trash')}</button></td>
    </tr>`;
  }).join('');
  const total = sumBy(list, e => e.total);
  const pending = sumBy(list.filter(e => e.reimbursement === 'pending'), e => e.total);
  const missing = list.filter(e => !e.photos.length).length;
  return `<div class="table-wrap"><table class="data" style="min-width:1020px">
    <thead><tr><th>Date</th><th>Item</th><th>Category</th><th class="num">Qty × price</th><th class="num">Total</th><th>Paid with</th><th>Reimbursement</th><th>Last change</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td colspan="4">${list.length === state.expenses.length ? plural(list.length, 'expense') : `${list.length} of ${state.expenses.length} expenses`}${missing ? ` · ${missing} without a receipt photo` : ''}</td><td class="num">${money(total)}</td><td colspan="4">${pending > 0 ? `${money(pending)} pending reimbursement` : ''}</td></tr></tfoot>
  </table></div>`;
}

/* ---------- Drop-ins ---------- */
function viewDropIns() {
  const t = totals();
  const people = dropInPeople();
  const owing = people.filter(p => p.owed > 0).length;
  const s = state.settings;
  const viewChip = (v, label) => `<button class="chip" data-action="drop-view" data-view="${v}" aria-pressed="${ui.dropView === v}">${label}</button>`;
  return `
  <div class="page-head"><h2>Drop-ins</h2><p class="muted">People who come to a practice or event without being full members. What they pay counts toward your net balance.</p></div>
  <section class="kpis three">
    ${kpi('Drop-in income', money(t.dropIns), `${plural(state.dropIns.length, 'visit')} from ${plural(people.length, 'person', 'people')}`)}
    ${kpi('Still owed', money(t.dropOwing), owing ? `${plural(owing, 'person', 'people')} still owe` : 'Nobody owes anything')}
    ${kpi('Rate per practice', money(s.dropInFee), `${s.freeFirstDropIn ? 'First visit free · ' : ''}<button class="link small" data-tab="settings">change</button>`)}
  </section>
  <div class="toolbar">
    <div class="search">${icon('search')}<input type="search" id="dropSearch" placeholder="Search names or practices…" value="${esc(ui.dropSearch)}" aria-label="Search drop-ins"></div>

function dropBadge(d) {
  const st = DROP_STATUS[dropStatus(d)];
  return `<span class="badge ${st.cls}">${icon(st.icon)}${st.label}</span>`;

function dropInsTable() {
  if (!state.dropIns.length) {
    return `<div class="card">${emptyState('users', 'No drop-ins yet', 'Record people who come to a practice or event without being full members. You can enter a whole group at once, like everyone at a Discovery Day.',
      `<button class="btn primary" data-action="add-dropin">${icon('plus')}Record drop-in</button><button class="btn" data-tab="data">${icon('upload')}Import a list</button>`)}</div>`;
  }
  const q = ui.dropSearch.trim().toLowerCase();
  const noMatch = `<div class="card">${emptyState('search', 'Nothing matches', 'Try a different search or filter.', '<button class="btn" data-action="clear-drop-filters">Clear filters</button>')}</div>`;
  if (ui.dropView === 'people') {
    const people = dropInPeople()
      .filter(p => (!q || [p.name, ...p.visits.map(v => v.session)].join(' ').toLowerCase().includes(q)) && (ui.dropFilter === 'all' || p.owed > 0))
      .sort((a, b) => b.last.localeCompare(a.last) || a.name.localeCompare(b.name));
    if (!people.length) return noMatch;
    const rows = people.map(p => {
      const visits = [...p.visits].reverse();
      const list = visits.slice(0, 4).map(v => [v.dateUnknown ? '' : esc(fmtDate(v.date)), esc(v.session)].filter(Boolean).join(' · ') || 'Date not recorded').join('<br>') + (visits.length > 4 ? `<br>+${visits.length - 4} more` : '');
      return `<tr>
        <td><div class="strong">${esc(p.name)}</div>${p.member ? `<span class="tag good">${icon('check')}Member</span>` : ''}</td>
        <td><div class="strong">${plural(p.visits.length, 'visit')}</div><div class="muted small">${list}</div></td>
        <td class="num">${money(p.charged)}</td>
        <td class="num">${money(p.paid)}</td>
        <td class="num">${p.owed > 0 ? `<span class="crit-text">${money(p.owed)}</span>` : '<span class="muted">—</span>'}</td>
        <td class="actions">
          <button class="btn sm" data-action="person-visit" data-name="${esc(p.name)}">${icon('plus')}Visit</button>
          ${p.owed > 0 ? `<button class="btn sm" data-action="person-paid" data-name="${esc(p.name)}">${icon('check')}Mark paid</button>` : ''}
          ${p.member ? '' : `<button class="btn sm" data-action="make-member" data-name="${esc(p.name)}" title="Add ${esc(p.name)} as a full member">${icon('user')}Make member</button>`}
        </td>
      </tr>`;
    }).join('');
    return `<div class="table-wrap"><table class="data">
      <thead><tr><th>Person</th><th>Visits</th><th class="num">Charged</th><th class="num">Paid</th><th class="num">Owed</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td>${plural(people.length, 'person', 'people')}</td><td>${plural(sumBy(people, p => p.visits.length), 'visit')}</td><td class="num">${money(sumBy(people, p => p.charged))}</td><td class="num">${money(sumBy(people, p => p.paid))}</td><td class="num">${money(sumBy(people, p => p.owed))}</td><td></td></tr></tfoot>
    </table></div>`;
  }
  const visits = state.dropIns
    .filter(d => (!q || [d.name, d.session, d.notes].join(' ').toLowerCase().includes(q)) && (ui.dropFilter === 'all' || dropOwed(d) > 0))
    .sort((a, b) => b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt));
  if (!visits.length) return noMatch;
  const rows = visits.map(d => {
    const edited = d.updatedAt !== d.createdAt;
    return `<tr>
      <td class="nowrap">${d.dateUnknown ? '<span class="muted">Not recorded</span>' : esc(fmtDate(d.date))}</td>
      <td><div class="strong">${esc(d.name)}</div>${d.notes ? `<div class="muted small">${esc(d.notes)}</div>` : ''}</td>
      <td>${esc(d.session) || '<span class="muted">—</span>'}</td>
      <td class="num">${money(d.fee)}</td>
      <td class="num">${money(d.paid)}</td>
      <td>${dropBadge(d)}${dropOwed(d) > 0 ? `<div style="margin-top:4px"><button class="link small" data-action="dropin-paid" data-id="${d.id}">Mark paid</button></div>` : ''}</td>
      <td>${d.paid > 0 ? esc(d.method) : '<span class="muted">—</span>'}</td>
      <td class="muted small nowrap">${edited ? 'Edited' : 'Added'}<br>${esc(fmtTS(d.updatedAt))}</td>
      <td class="actions"><button class="icon-btn" data-action="edit-dropin" data-id="${d.id}" title="Edit visit" aria-label="Edit visit">${icon('pencil')}</button><button class="icon-btn danger" data-action="delete-dropin" data-id="${d.id}" title="Delete visit" aria-label="Delete visit">${icon('trash')}</button></td>
    </tr>`;
  }).join('');
  return `<div class="table-wrap"><table class="data" style="min-width:900px">
    <thead><tr><th>Date</th><th>Name</th><th>Practice / event</th><th class="num">Charged</th><th class="num">Paid</th><th>Status</th><th>Paid with</th><th>Last change</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td colspan="3">${visits.length === state.dropIns.length ? plural(visits.length, 'visit') : `${visits.length} of ${state.dropIns.length} visits`}</td><td class="num">${money(sumBy(visits, d => d.fee))}</td><td class="num">${money(sumBy(visits, d => d.paid))}</td><td colspan="4">${sumBy(visits, dropOwed) > 0 ? `${money(sumBy(visits, dropOwed))} still owed` : ''}</td></tr></tfoot>
  </table></div>`;
}

    const n = state.expenses.filter(e => e.category === c).length;
    const status = levelTag(level, pct) || (b > 0 ? `<span class="tag good">${icon('check')}On track</span>` : '<span class="muted small">—</span>');
    return `<tr>

      <td class="meter-cell">${meter(pct, level, `${c}: ${fmtPct(pct)} of budget used`)}<span class="small muted">${b > 0 ? fmtPct(pct) + ' used' : 'No budget'}</span></td>
      <td>${status}</td>

  }).join('');
  return `

  <section class="kpis three">
    ${kpi('Total budget', money(totalB))}
    ${kpi('Spent so far', money(totalS), totalB > 0 ? `${fmtPct((totalS / totalB) * 100)} of budget` : '')}
    ${totalB > 0 ? kpi('Remaining', `<span class="${totalS > totalB ? 'crit-text' : ''}">${money(totalB - totalS)}</span>`) : kpi('Remaining', '—', 'Set budgets below to track this')}
  </section>
  <div class="table-wrap"><table class="data">
    <thead><tr><th>Category</th><th class="num">Budget</th><th class="num">Spent</th><th class="num">Remaining</th><th>Used</th><th>Status</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td>Total</td><td class="num">${money(totalB)}</td><td class="num">${money(totalS)}</td><td class="num">${money(totalB - totalS)}</td><td colspan="2">${totalB > 0 ? fmtPct((totalS / totalB) * 100) + ' of total budget used' : ''}</td></tr></tfoot>
  </table></div>
  <div class="add-cat"><input type="text" id="newCategory" maxlength="40" placeholder="New category, e.g. Coaching or Regatta fees" aria-label="New category name"><button class="btn" data-action="add-category">${icon('plus')}Add category</button></div>
  <p class="hint" style="margin-top:10px">Budget changes save as soon as you leave a box or press Enter.</p>`;
}

function addCategory() {
  const input = $('#newCategory');
  const name = titleish(input ? input.value : '');
  if (!name) { toast('Type a name for the new category first'); input && input.focus(); return; }
  if (cats().some(c => normKey(c) === normKey(name))) { toast(`There’s already a “${name}” category`); return; }
  const at = cats().indexOf('Miscellaneous');
  if (at >= 0) state.categories.splice(at, 0, name); else state.categories.push(name);
  state.budgets[name] = 0;
  commit(`Added category “${name}”`, { type: 'category' });
  toast(`Added “${name}”. Set its budget in the table.`);
}

function openRenameCategory(cat) {
  openModal({
    title: 'Rename category',
    body: `<label class="field"><span>New name for “${esc(cat)}”</span><input type="text" name="name" value="${esc(cat)}" required autofocus maxlength="40"></label>`,
    submitLabel: 'Rename',
    onSubmit: (fd, form) => {
      const name = titleish(fd.name);
      if (!name) return formError(form, 'Enter a name.');
      if (name === cat) return;
      if (cats().some(c => c !== cat && normKey(c) === normKey(name))) return formError(form, 'There’s already a category with that name.');
      state.categories[state.categories.indexOf(cat)] = name;
      state.budgets[name] = state.budgets[cat] || 0;
      delete state.budgets[cat];
      let n = 0;
      for (const e of state.expenses) if (e.category === cat) { e.category = name; n++; }
      if (ui.expenseCategory === cat) ui.expenseCategory = name;
      if (ui.lastCategory === cat) ui.lastCategory = name;
      commit(`Renamed category “${cat}” to “${name}”${n ? ` (${plural(n, 'expense')})` : ''}`, { type: 'category' });
      toast('Category renamed');
    },
  });
}

function openDeleteCategory(cat) {
  if (cats().length <= 1) { toast('You need at least one category'); return; }
  const n = state.expenses.filter(e => e.category === cat).length;
  const others = cats().filter(c => c !== cat);
  const fallback = others.includes('Miscellaneous') ? 'Miscellaneous' : others[others.length - 1];
  openModal({
    title: `Delete “${esc(cat)}”?`,
    body: n
      ? `<p class="confirm-msg">${plural(n, 'expense')} ${n === 1 ? 'is' : 'are'} in this category.</p>
         <label class="field"><span>Move ${n === 1 ? 'it' : 'them'} to</span><select name="target">${others.map(c => `<option ${c === fallback ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>`
      : `<p class="confirm-msg">No expenses use this category${state.budgets[cat] ? `, and its ${money(state.budgets[cat])} budget will be removed` : ''}.</p>`,
    submitLabel: 'Delete category',
    danger: true,
    onSubmit: fd => {
      const snap = JSON.stringify(state);
      const target = others.includes(fd.target) ? fd.target : fallback;
      for (const e of state.expenses) if (e.category === cat) e.category = target;
      state.categories = others;
      delete state.budgets[cat];
      if (ui.expenseCategory === cat) ui.expenseCategory = 'all';
      if (ui.lastCategory === cat) ui.lastCategory = target;
      commit(`Deleted category “${cat}”${n ? `; moved ${plural(n, 'expense')} to ${target}` : ''}`, { type: 'category' });
      undoable('Category deleted', snap, `delete category ${cat}`);
    },
  });
}

/* =====================================================================
   Modals, confirmations, toasts
   ===================================================================== */
let modalToken = 0;
let modalReturnFocus = null;
let modalCleanup = null;
let modalDropHandler = null;
const modalIsOpen = () => !!$('#modalRoot').firstElementChild;

function openModal({ title, body, submitLabel = 'Save', cancelLabel = 'Cancel', danger = false, wide = false, onSubmit, onOpen, onClose }) {
  const token = ++modalToken;
  if (!modalIsOpen()) modalReturnFocus = document.activeElement;
  if (modalCleanup) { const c = modalCleanup; modalCleanup = null; c(); }
  modalDropHandler = null;
  $('#modalRoot').innerHTML = `<div class="modal-backdrop">
    <div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <form id="modalForm" autocomplete="off">
        <header class="modal-head"><h2 id="modalTitle">${title}</h2><button type="button" class="icon-btn" data-close aria-label="Close">${icon('x')}</button></header>
        <div class="modal-body">${body}<p class="form-error" hidden></p></div>
        <footer class="modal-foot">
          <button type="button" class="btn" data-close>${cancelLabel}</button>
          ${submitLabel ? `<button type="submit" class="btn ${danger ? 'danger-solid' : 'primary'}">${submitLabel}</button>` : ''}
        </footer>
      </form>
    </div></div>`;
  const form = $('#modalForm');
  modalCleanup = onClose || null;
  form.addEventListener('submit', e => {
    e.preventDefault();
    if (!onSubmit) { closeModal(); return; }
    const finish = r => { if (r !== false && token === modalToken) closeModal(); };
    const result = onSubmit(Object.fromEntries(new FormData(form)), form);
    if (result && typeof result.then === 'function') {
      const btn = form.querySelector('[type=submit]');
      if (btn) btn.disabled = true;
      result.then(r => { if (btn) btn.disabled = false; finish(r); },
        err => { if (btn) btn.disabled = false; formError(form, String((err && err.message) || err)); });
    } else finish(result);
  });
  form.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
  if (onOpen) onOpen(form);
  const first = form.querySelector('[autofocus]') || form.querySelector('.modal-body input:not([type=hidden]):not([type=radio]):not([type=file]), .modal-body select, .modal-body textarea') || form.querySelector('[type=submit]') || form.querySelector('[data-close]');
  if (first) first.focus();
}
function closeModal() {
  if (modalCleanup) { const c = modalCleanup; modalCleanup = null; c(); }
  modalDropHandler = null;
  $('#modalRoot').innerHTML = '';
  if (modalReturnFocus && document.contains(modalReturnFocus)) modalReturnFocus.focus({ preventScroll: true });
  modalReturnFocus = null;
}
function formError(form, msg) {
  const el = form.querySelector('.form-error');
  el.textContent = msg;
  el.hidden = false;
  return false;
}
function confirmDialog({ title, message, confirmLabel = 'Confirm', danger = false, extraHtml = '', onConfirm }) {
  openModal({ title, body: `<p class="confirm-msg">${esc(message)}</p>${extraHtml}`, submitLabel: confirmLabel, danger, onSubmit: () => { onConfirm(); } });
}
function toast(message, opts = {}) {
  const el = document.createElement('div');
  el.className = 'toast' + (opts.error ? ' error' : '');
  el.setAttribute('role', 'status');
  el.innerHTML = `<span>${esc(message)}</span>`;
  if (opts.action) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = opts.action.label;
    b.addEventListener('click', () => { el.remove(); opts.action.fn(); });
    el.appendChild(b);
  }
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), opts.ms || (opts.action ? 8000 : 3500));
}

  const onPlan = plan ? state.members.filter(m => m.planId === plan.id).length : 0;
  openModal({
    title: plan ? 'Edit fee plan' : 'New fee plan',
    body: `
      <label class="field"><span>Plan name</span><input type="text" name="name" value="${esc(plan?.name || '')}" required autofocus maxlength="60" placeholder="e.g. Full season, Students / new grads"></label>
      <div class="field"><span>Payments and due dates</span>
        <div class="inst-list" id="instList">${rowsHtml(start)}</div>
        <div class="row" style="justify-content:space-between;margin-top:6px"><button type="button" class="btn sm" id="addInst">${icon('plus')}Add another payment</button><span>Total: <strong id="planTotalOut"></strong></span></div>
        <small class="hint">One row if it’s paid all at once, or one row per installment (e.g. $325 by Dec 7, $260 by Jan 11, $215 by Mar 1). Leave a date blank if there’s no deadline.</small>
      </div>
      ${plan ? `<p class="hint">${plural(onPlan, 'member')} on this plan. If you change the total, members whose fee matched the old total move to the new one.</p>` : ''}`,
    submitLabel: plan ? 'Save plan' : 'Create plan',
    onOpen: form => {
      const list = form.querySelector('#instList');
      const refresh = () => {
        [...list.children].forEach((r, i) => { r.firstElementChild.textContent = '#' + (i + 1); });
        const amounts = [...list.querySelectorAll('.inst-amount')].map(x => parseMoney(x.value) || 0);
        form.querySelector('#planTotalOut').textContent = money(sumBy(amounts, x => x));
      };
      form.querySelector('#addInst').addEventListener('click', () => {
        list.insertAdjacentHTML('beforeend', rowsHtml([{ amount: '', dueDate: '' }]));
        refresh();
        list.lastElementChild.querySelector('.inst-amount').focus();
      });
      list.addEventListener('click', ev => {
        const b = ev.target.closest('.inst-remove');
        if (b && list.children.length > 1) { b.closest('.inst-row').remove(); refresh(); }
      });
      list.addEventListener('input', refresh);
      refresh();
    },
    onSubmit: (fd, form) => {
      const name = fd.name.trim().replace(/\s+/g, ' ');
      if (!name) return formError(form, 'Give the plan a name.');
      if (state.feePlans.some(p => p.id !== plan?.id && normName(p.name) === normName(name))) return formError(form, 'There’s already a plan with that name.');
      const installments = [];
      for (const r of form.querySelectorAll('.inst-row')) {
        const raw = r.querySelector('.inst-amount').value;
        if (!raw.trim()) continue;
        const amount = parseMoney(raw);
        if (amount == null || amount <= 0) return formError(form, 'Each payment needs an amount above zero.');
        const due = r.querySelector('.inst-due').value;
        installments.push({ amount, dueDate: isValidDateStr(due) ? due : '' });
      }
      if (!installments.length) return formError(form, 'Add at least one payment amount.');
      const total = sumBy(installments, i => i.amount);
      if (plan) {
        const oldTotal = planTotal(plan);
        Object.assign(plan, { name, installments });
        let moved = 0;
        if (oldTotal !== total) {
          const now = nowISO();
          for (const m of state.members) if (m.planId === plan.id && m.feeTarget === oldTotal) { m.feeTarget = total; m.updatedAt = now; moved++; }
        }
        commit(`Updated fee plan “${name}” (${money(total)})${moved ? `; ${plural(moved, 'member')} moved to the new total` : ''}`, { type: 'plan' });
        toast('Fee plan saved');
        return;
      }
      const p = { id: uid(), name, installments };
      state.feePlans.push(p);
      commit(`Created fee plan “${name}” (${money(total)})`, { type: 'plan' });
      const matches = state.members.filter(m => !m.planId && m.feeTarget === total);
      if (!matches.length) { toast('Fee plan created'); return; }
      confirmDialog({
        title: 'Put matching members on this plan?',
        message: `${plural(matches.length, 'member')} ${matches.length === 1 ? 'has' : 'have'} a fee of exactly ${money(total)} and no plan yet. Put ${matches.length === 1 ? 'them' : 'them all'} on “${name}” so their installments and due dates are tracked?`,
        confirmLabel: `Yes, assign ${matches.length}`,
        onConfirm: () => {
          const now = nowISO();
          for (const m of matches) { m.planId = p.id; m.updatedAt = now; }
          commit(`Put ${plural(matches.length, 'member')} on the “${name}” plan`, { type: 'plan' });
          toast('Plan assigned');
        },
      });
    },
  });
}

function deletePlan(id) {
  const p = state.feePlans.find(x => x.id === id);
  if (!p) return;
  const members = state.members.filter(m => m.planId === id);
  confirmDialog({
    title: `Delete the “${esc(p.name)}” plan?`,
    message: members.length
      ? `${plural(members.length, 'member')} on this plan will keep their fee amount but switch to a single due date (their own, or the team date in Settings).`
      : 'No members are on this plan.',
    confirmLabel: 'Delete plan',
    danger: true,
    onConfirm: () => {
      const snap = JSON.stringify(state);
      state.feePlans = state.feePlans.filter(x => x.id !== id);
      for (const m of members) m.planId = '';
      commit(`Deleted fee plan “${p.name}”`, { type: 'delete' });
      undoable('Fee plan deleted', snap, `delete plan ${p.name}`);
    },
